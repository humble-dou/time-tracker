  <title>玲珑万物生</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3C!-- 外层火焰 - 橙红 --%3E%3Cpath d='M64 8 C64 8 104 44 104 80 C104 100 86 118 64 118 C42 118 24 100 24 80 C24 62 34 48 38 38 C38 56 46 64 54 60 C52 44 60 28 64 8Z' fill='%23ff6b35'/%3E%3C!-- 中层火焰 - 橙黄 --%3E%3Cpath d='M64 30 C64 30 86 52 86 78 C86 92 76 104 64 104 C52 104 42 92 42 78 C42 68 46 60 50 54 C50 64 56 70 64 66 C64 56 64 44 64 30Z' fill='%23ffaa33'/%3E%3C!-- 内层火焰 - 亮黄 --%3E%3Cpath d='M64 50 C64 50 74 62 74 76 C74 84 70 90 64 90 C58 90 54 84 54 76 C54 70 58 66 60 64 C60 68 62 70 64 68 C64 62 64 56 64 50Z' fill='%23ffe066'/%3E%3C!-- 时钟表盘 --%3E%3Ccircle cx='64' cy='78' r='20' fill='%23fff' opacity='0.95'/%3E%3Ccircle cx='64' cy='78' r='16' fill='none' stroke='%23ff6b35' stroke-width='1.5'/%3E%3Cline x1='64' y1='78' x2='64' y2='64' stroke='%23ff6b35' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='64' y1='78' x2='76' y2='84' stroke='%23ff6b35' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='64' cy='78' r='2.5' fill='%23ff6b35'/%3E%3C/svg%3E">

  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f7f5f0;
      --bg2: #ffffff;
      --ink: #1a120b;
      --muted: #4a3f32;
      --rule: #ece5db;
      --accent: #e8895b;
      --accent-light: rgba(232, 137, 91, 0.12);
      --accent2: #5e9eab;
      --good: #6b9e4e;
      --warn: #e8a838;
      --danger: #d9665a;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 2px 12px rgba(94, 110, 100, 0.08);
      --shadow-lg: 0 8px 30px rgba(94, 110, 100, 0.12);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      position: relative;
    }

    /* Background atmosphere image */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('bg-fish.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.58;
      z-index: -1;
      pointer-events: none;
    }
    body.week-page::before { opacity: 0.58; }
    body.month-page::before { opacity: 0.58; }
    body.stats-page::before { opacity: 0.58; }
    body.settings-page::before { opacity: 0.58; }
    /* 侧边栏打开时，背景图中心对齐右侧内容区 */
    body.warehouse-open::before {
      background-position: calc(50% + var(--bg-offset, 170px)) center;
    }
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(247,245,240,0.06) 0%, rgba(247,245,240,0.14) 100%);
      z-index: -1;
      pointer-events: none;
    }
    .app { position: relative; }

    /* ---- Page themes & decorative banners ---- */
    .page-deco {
      position: relative; border-radius: var(--radius); margin-bottom: 12px;
      overflow: hidden; padding: 20px 16px;
    }
    .page-deco .deco-title { font-size: 18px; font-weight: 800; color: #fff; position: relative; z-index: 1; }
    .page-deco .deco-sub { font-size: 15px; color: rgba(255,255,255,0.85); margin-top: 2px; position: relative; z-index: 1; }
    .deco-review-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%); z-index: 2;
      padding: 6px 14px; border: 1.5px solid rgba(255,255,255,0.5); border-radius: 999px;
      background: rgba(127,176,105,0.6); color: #fff;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .deco-review-btn:hover { background: rgba(127,176,105,0.68); }
    .deco-review-btn.active { background: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.8); color: #fff; }
    .deco-review-btn.theme-month { background: rgba(200,160,70,0.6); }
    .deco-review-btn.theme-month:hover { background: rgba(200,160,70,0.72); }
    .deco-review-btn.theme-month.active { background: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.8); color: #fff; }

    /* Month Weekly Review List */
    .month-week-reviews { margin-bottom: 12px; }
    .mwr-card {
      display: flex; align-items: stretch;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 55%, rgba(255,255,255,0.36) 100%);
      border: 1.5px solid rgba(255,255,255,0.36); backdrop-filter: blur(2px);
      border-radius: var(--radius-sm); margin-bottom: 8px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.3); overflow: hidden;
    }
    .mwr-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 6px; min-width: 56px;
      background: linear-gradient(135deg, rgba(200,160,70,0.12), transparent);
      border-right: 1px solid var(--rule); flex-shrink: 0;
    }
    .mwr-week-label { font-size: 15px; font-weight: 800; color: var(--ink); }
    .mwr-date-range { font-size: 13px; font-weight: 700; color: #b07d20; }
    .mwr-summary { font-size: 10px; color: var(--muted); text-align: center; }
    .mwr-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .mwr-day-content { font-size: 13px; line-height: 1.5; color: var(--ink); white-space: pre-wrap; }
    .mwr-day-empty { font-size: 12px; color: var(--muted); }
    .page-deco .deco-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); opacity: 0.25; }

    /* Day theme: coral peach */
    #pageDay .page-deco { background: linear-gradient(135deg, rgba(232,137,91,0.5), rgba(245,184,134,0.5)); }
    /* Week theme: sage green */
    #pageWeek .page-deco { background: linear-gradient(135deg, rgba(127,176,105,0.5), rgba(168,201,122,0.5)); }
    /* Month theme: warm amber */
    #pageMonth .page-deco { background: linear-gradient(135deg, rgba(232,168,56,0.5), rgba(245,205,106,0.5)); }
    /* Stats theme: dusty rose */
    #pageStats .page-deco { background: linear-gradient(135deg, rgba(212,134,155,0.5), rgba(232,165,181,0.5)); }

    /* Floating decorative shapes */
    .deco-bubble {
      position: absolute; border-radius: 50%; background: rgba(255,255,255,0.12);
    }
    .deco-leaf {
      position: absolute; width: 40px; height: 40px;
      background: rgba(255,255,255,0.08); border-radius: 0 100% 0 100%;
    }

    .app {
      max-width: 500px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: calc(72px + var(--safe-bottom));
    }

    /* ---- Top Header ---- */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(247, 245, 240, 0.26);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--rule);
      border-radius: 0 0 var(--radius) var(--radius);
      min-height: 62px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .header-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #headerCenter { transform: translateX(-0.8cm); }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .header-date { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .nav-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      font-size: 18px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
    }
    .nav-btn:active { transform: scale(0.9); }
    .header-sound-btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: var(--accent-light); color: var(--accent);
      font-size: 16px; cursor: pointer; display: grid; place-items: center; flex-shrink: 0;
      transition: background 0.15s, color 0.15s;
    }
    .header-sound-btn:active { transform: scale(0.9); }
    .header-sound-btn.muted { color: var(--muted); }

    /* ---- Bottom Tab Bar ---- */
    .tabbar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 500px;
      background: rgba(247, 245, 240, 0.26);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border-top: 1px solid var(--rule);
      display: flex; padding-bottom: var(--safe-bottom); z-index: 100;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .tab {
      flex: 1; border: none; background: none; padding: 8px 0 6px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: var(--muted); font-size: 11px; cursor: pointer; transition: color 0.15s;
    }
    .tab svg { width: 22px; height: 22px; }
    .tab.active { color: var(--accent); }
    .tab:active { transform: scale(0.92); }

    /* ---- Pages ---- */
    .page { display: none; padding: 12px 16px; }
    .page.active { display: block; }

    /* Day page: slightly clearer background */
    #pageDay::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('bg-fish.png');
      background-size: cover;
      background-position: center;
      opacity: 0.02;
      z-index: -1;
      pointer-events: none;
    }

    /* ---- Cards ---- */
    .card { background: rgba(255,255,255,0.14); border: 1.5px solid rgba(255,255,255,0.28); backdrop-filter: blur(2px); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.22); padding: 16px; margin-bottom: 12px; color: #1a120b; text-shadow: 0 1px 2px rgba(255,255,255,0.6); }
    .card-title { font-size: 15px; font-weight: 800; color: #3d2e1f; margin: 0 0 10px; letter-spacing: 0.02em; text-shadow: 0 1px 3px rgba(255,255,255,0.7); }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card-title-row .card-title { margin: 0; }
    .tl-add-btn {
      width: 30px; height: 30px; border: none; border-radius: 50%;
      background: var(--accent); color: #fff; font-size: 20px; line-height: 1;
      cursor: pointer; box-shadow: 0 2px 8px rgba(232,137,91,0.3);
      display: grid; place-items: center; transition: transform 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .tl-add-btn:active { transform: scale(0.9); }

    /* ---- Timer Widget (3 states) ---- */
    .timer-widget {
      padding: 16px 20px;
      color: #fff;
      margin: 0 auto 12px;
      margin-top: -4px;
      width: 100%;
      max-width: 320px;
      position: relative;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .timer-widget.idle {
      background: transparent;
    }
    .timer-widget.running {
      background: transparent;
    }

    .timer-clock-label { font-size: 14px; opacity: 1; margin-bottom: 4px; font-weight: 600; text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.3); }
    .timer-clock-label.recording {
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    /* 水波泡泡动画 - 小丑鱼形状 */
    .wave-bubble {
      position: relative;
      width: 84px; height: 38px;
      display: inline-block;
      vertical-align: middle;
      animation: fish-float 3s ease-in-out infinite;
    }
    .wave-bubble svg {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
      transform: scaleX(-1); /* 翻转，头朝左 */
    }
    @keyframes fish-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .wave-bubble .fish-body {
      fill: rgba(255, 127, 63, 0.25);
    }
    .wave-bubble .fish-stripe {
      fill: rgba(255, 255, 255, 0.5);
    }
    .wave-bubble .wave-group {
      animation: wave-move 2.5s linear infinite;
    }
    .wave-bubble .wave-group-2 {
      animation: wave-move 3.5s linear infinite reverse;
      opacity: 0.6;
    }
    .wave-bubble .bubble-1 {
      animation: fish-bubble-1 2s ease-in infinite;
    }
    .wave-bubble .bubble-2 {
      animation: fish-bubble-2 2.3s ease-in infinite;
    }
    .wave-bubble .bubble-3 {
      animation: fish-bubble-3 2.7s ease-in infinite;
    }
    @keyframes wave-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes fish-bubble-1 {
      0% { cy: 18; opacity: 0; r: 1; }
      20% { opacity: 0.9; r: 1.5; }
      100% { cy: 4; opacity: 0; r: 0.5; }
    }
    @keyframes fish-bubble-2 {
      0% { cy: 18; opacity: 0; r: 0.8; }
      20% { opacity: 0.8; r: 1.2; }
      100% { cy: 6; opacity: 0; r: 0.4; }
    }
    @keyframes fish-bubble-3 {
      0% { cy: 18; opacity: 0; r: 1.2; }
      25% { opacity: 0.9; r: 2; }
      100% { cy: 3; opacity: 0; r: 0.6; }
    }
    @keyframes wave-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes bubble-rise {
      0% {
        bottom: 2px;
        opacity: 0;
        transform: translateX(0) scale(0.5);
      }
      20% {
        opacity: 0.8;
        transform: translateX(1px) scale(1);
      }
      80% {
        opacity: 0.6;
        transform: translateX(-1px) scale(1.1);
      }
      100% {
        bottom: 12px;
        opacity: 0;
        transform: translateX(0) scale(0.3);
      }
    }
    .timer-clock {
      font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 4px; text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.4);
    }
    .timer-clock-seconds { font-size: 36px; opacity: 0.95; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.3); }
    .timer-sub { font-size: 14px; opacity: 0.95; margin-top: 6px; font-weight: 500; text-shadow: 0 2px 8px rgba(0,0,0,0.6), 0 0 20px rgba(0,0,0,0.3); }

    .timer-elapsed {
      font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7), 0 0 30px rgba(0,0,0,0.4);
    }

    .timer-big-btn {
      border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: 999px;
      padding: 12px 36px; font-size: 18px; font-weight: 800;
      cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      margin-top: 14px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .timer-big-btn:active { transform: scale(0.95); }
    .timer-big-btn.start { color: #ff7f3f; font-weight: 900; }
    .timer-big-btn.start:hover { background: rgba(255,255,255,0.32); box-shadow: 0 6px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.4); }
    .timer-big-btn.stop { color: #5a9fe0; font-weight: 900; text-shadow: 0 1px 2px rgba(255,255,255,0.3); }
    .timer-big-btn.stop:hover { background: rgba(255,255,255,0.32); box-shadow: 0 6px 20px rgba(0,0,0,0.15), inset 0 1px 0 rgba(255,255,255,0.4); }
    .timer-btn-row {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 14px;
    }
    .timer-rst-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(2px);
      color: #4a90d9; border: 1.5px solid rgba(255,255,255,0.4);
      font-size: 10px; font-weight: 700;
      cursor: pointer; transition: transform 0.1s, opacity 0.15s, background 0.15s;
      padding: 0; display: flex; align-items: center; justify-content: center;
      opacity: 0.85;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.3);
    }
    .timer-rst-btn:hover { background: rgba(255,255,255,0.32); }
    .timer-rst-btn:active { transform: scale(0.95); }

    /* ---- Activity Timeline ---- */
    .timeline { position: relative; }
    .timeline::before {
      content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px;
      width: 2px; background: var(--rule);
    }
    .timeline-item { position: relative; padding-left: 28px; padding-bottom: 14px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: ""; position: absolute; left: 4px; top: 6px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--bg2); box-shadow: 0 0 0 1px var(--accent);
    }
    .timeline-item[data-cat="工作"]::before { background: #e8895b; box-shadow: 0 0 0 1px #e8895b; }
    .timeline-item[data-cat="学习"]::before { background: #7fb069; box-shadow: 0 0 0 1px #7fb069; }
    .timeline-item[data-cat="运动"]::before { background: #6b9e4e; box-shadow: 0 0 0 1px #6b9e4e; }
    .timeline-item[data-cat="休息"]::before { background: #e8a838; box-shadow: 0 0 0 1px #e8a838; }
    .timeline-item[data-cat="生活"]::before { background: #d9665a; box-shadow: 0 0 0 1px #d9665a; }
    .timeline-item[data-cat="其他"]::before { background: #a89888; box-shadow: 0 0 0 1px #a89888; }
    .timeline-item.highlight {
      animation: highlight-pulse 2.5s ease-out;
      border-radius: 8px;
    }
    @keyframes highlight-pulse {
      0% { background: rgba(127,176,105,0.35); box-shadow: 0 0 0 2px rgba(127,176,105,0.6); }
      70% { background: rgba(127,176,105,0.18); box-shadow: 0 0 0 1px rgba(127,176,105,0.3); }
      100% { background: transparent; box-shadow: none; }
    }

    .timeline-time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 2px; font-weight: 700; }
    .timeline-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
    .timeline-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .tag.tag-primary { box-shadow: 0 0 0 1.5px currentColor; }
    .tag[data-cat="工作"] { background: rgba(232,137,91,0.28); color: #c96a3a; }
    .tag[data-cat="学习"] { background: rgba(127,176,105,0.28); color: #4a7a3a; }
    .tag[data-cat="运动"] { background: rgba(107,158,78,0.28); color: #4a7a35; }
    .tag[data-cat="休息"] { background: rgba(232,168,56,0.28); color: #a87818; }

    .timeline-duration { font-size: 13px; color: var(--muted); }

    /* ---- Modal / Sheet ---- */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 200; display: none; animation: fadein 0.15s; }
    .overlay.show { display: block; }
    @keyframes fadein { from { opacity: 0; } }
    .sheet {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: calc(100% - 24px); max-width: 500px; background: var(--bg2);
      border-radius: 20px; z-index: 201;

      opacity: 0; visibility: hidden;
    }
    .sheet.show { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; }
    .sheet-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 999px; margin: 10px auto; flex-shrink: 0; }
    .sheet-close {

      border: none; border-radius: 50%; background: rgba(0,0,0,0.12); color: #666;

      padding: 0; transition: all 0.15s; display: block;

    .sheet-footer {

    .duration-banner {

    .duration-banner .db-time { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .duration-banner .db-range { font-size: 13px; opacity: 0.85; margin-top: 2px; }

    .form-group { margin-bottom: 16px; }

    .form-textarea { resize: none; min-height: 70px; }
    .form-row { display: flex; gap: 10px; }

    .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .cat-btn {

      gap: 10px;
      margin-bottom: 10px;

    .cat-hint {

    /* ---- Week View (flat events) ---- */
    .week-list { margin-bottom: 12px; }
    .week-day-card {
      display: flex; align-items: stretch;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.12) 55%, rgba(255,255,255,0.36) 100%);

    .week-detail { margin-top: 4px; }

    /* ---- Month View (flat events) ---- */
    .month-grid { display: grid; grid-template-columns: 20px repeat(7, 1fr); gap: 3px; margin-bottom: 12px; }
    .mg-dot-btn { width: 12px; height: 12px; border-radius: 50%; background: rgba(127,176,105,0.5); border: none; cursor: pointer; align-self: center; justify-self: center; transition: background 0.15s, transform 0.15s; padding: 0; }
    .mg-dot-btn:hover { background: rgba(127,176,105,0.9); transform: scale(1.3); }
    .mg-dot-cell { display: flex; align-items: center; justify-content: center; }

    }

    .month-cell .mc-event {

      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.3;

    /* ---- Review Section ---- */
    .review-section { margin-top: 8px; }

    /* ---- Daily Plan ---- */

      margin: 0 0 10px;
    }
    .plan-title-row .card-title { margin: 0; }
    .plan-collapse-btn {

      display: flex; align-items: center; justify-content: center;
      padding: 0; opacity: 0.6; flex-shrink: 0;
    }
    .plan-collapse-btn::before {
      content: ''; width: 5px; height: 5px;

      transition: transform 0.2s;
    }
    .plan-collapse-btn.collapsed::before { transform: rotate(-45deg); }
    .plan-card .plan-hint {

    }
    .plan-list { margin-bottom: 10px; }
    .plan-item {

    .plan-add-btn { box-shadow: 0 2px 10px rgba(232,137,91,0.3); }
    .plan-text { flex: 1; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
    .plan-edit-input {

    }
    .plan-del { border: none; background: none; color: var(--danger); font-size: 14px; cursor: pointer; padding: 0 4px; }
    .plan-add-row { display: flex; gap: 8px; }
    .plan-add-input {
      flex: 1; border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px;
      padding: 5px 10px; font-size: 12px; font-family: inherit;

    }

    .plan-add-btn {

    .review-textarea {
      width: 100%; min-height: 70px; border: 1.5px solid rgba(255,255,255,0.4);
      border-radius: var(--radius-sm); padding: 10px; font-size: 14px; font-family: inherit;

    .review-pin-btn {
      margin-left: auto; width: 18px; height: 18px; border-radius: 5px; border: none;

    .review-pin-overlay {

    .stats-filter-btn:hover { opacity: 1; }
    .stats-filter-btn::after {
      content: '▾'; position: absolute; right: 8px; top: 50%;
      transform: translateY(-50%); font-size: 11px; color: var(--muted);
    }
    .stats-filter-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; min-width: 100%;
      background: var(--bg2); border: 1.5px solid var(--rule); border-radius: 10px;
      z-index: 50; max-height: 200px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      display: none;
    }
    .stats-filter-dropdown.show { display: block; }
    .stats-filter-option {
      padding: 8px 12px; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      transition: background 0.1s;
      white-space: nowrap;
    }
    .stats-filter-option:hover { background: var(--accent-light); }
    .stats-filter-option.selected { color: var(--accent); font-weight: 600; }
    .stats-filter-option .check { width: 14px; height: 14px; border: 1.5px solid var(--rule); border-radius: 3px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; }
    .stats-filter-option.selected .check { background: var(--accent); border-color: var(--accent); color: #fff; }
    .stats-filter-option.disabled { opacity: 0.4; pointer-events: none; }

    /* ---- Settings ---- */
    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--rule); }
    .settings-item:last-child { border-bottom: none; }
    .settings-label { font-size: 15px; }
    .settings-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .settings-btn { border: 1.5px solid var(--rule); border-radius: 999px; padding: 6px 16px; font-size: 14px; font-weight: 600; background: var(--bg); color: var(--accent); cursor: pointer; }
    #pageSettings .settings-btn { color: #89bceb; border-color: rgba(137,188,235,0.3); }
    #pageSettings .settings-btn#clearBtn { color: var(--danger); }

    /* ---- Toast ---- */
    .toast {
      position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: #fff; padding: 8px 20px; border-radius: 999px;
      font-size: 14px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s, transform 0.2s; z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- Empty State ---- */
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 40px; margin-bottom: 8px; }
    .empty-text { font-size: 14px; }

    /* ---- Timer running indicator ---- */
    .timer-badge {
      display: none !important;
    }
    /* 已废弃：右上角计时中徽章
    .timer-badge {
      position: fixed; top: 8px; right: 20px; background: var(--danger);
      color: #fff; font-size: 11px; font-weight: 700; padding: 3px 8px;
      border-radius: 999px; z-index: 60; display: none; animation: pulse 2s infinite;
    }
    .timer-badge.show { display: block; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    */

    /* ---- Pomodoro Timer ---- */
    .pomo-icon {
      position: relative; z-index: 60; cursor: pointer;
      width: 44px; height: 40px; transition: transform 0.15s, opacity 0.25s;
      opacity: 0; flex-shrink: 0;
    }
    .pomo-icon.show { opacity: 0.82; }
    .pomo-icon:active { transform: scale(0.85); }
    .pomo-icon.flash { animation: pomo-flash 0.5s ease-in-out infinite; opacity: 1; }
    @keyframes pomo-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.15; } }
    .pomo-icon svg { width: 100%; height: 100%; display: block; }
    .pomo-time-text {
      font-size: 16px; font-weight: 800; fill: #fff; text-anchor: middle;
      pointer-events: none; font-family: -apple-system, 'SF Mono', monospace;
      letter-spacing: 0.4px;
    }
    .pomo-sheet {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9);
      background: var(--bg); border-radius: 20px; z-index: 250;
      padding: 20px; width: 220px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      opacity: 0; pointer-events: none; transition: all 0.2s;
    }
    .pomo-sheet.show { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
    .pomo-sheet-title { font-size: 15px; font-weight: 700; color: var(--muted); text-align: center; margin-bottom: 12px; }
    .pomo-time-display { font-size: 40px; font-weight: 800; color: var(--accent); text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
    .pomo-presets { display: flex; gap: 6px; margin-bottom: 12px; }
    .pomo-preset {
      flex: 1; border: 1.5px solid var(--rule); border-radius: 999px; background: var(--bg);
      color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 0; cursor: pointer;
      transition: all 0.15s;
    }
    .pomo-preset.active { border-color: var(--accent); color: var(--accent); background: rgba(232,137,91,0.08); }
    .pomo-custom { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
    .pomo-custom input { width: 50px; text-align: center; border: 1.5px solid var(--rule); border-radius: 8px; padding: 5px 0; font-size: 14px; color: var(--muted); background: var(--bg); outline: none; }
    .pomo-custom span { font-size: 12px; color: var(--muted); }
    .pomo-controls { display: flex; gap: 8px; }
    .pomo-btn { flex: 1; border: none; border-radius: 999px; padding: 8px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
    .pomo-btn-start { background: var(--accent); color: #fff; }
    .pomo-btn-reset { background: var(--bg); border: 1.5px solid var(--rule); color: var(--muted); }

    @media (max-width: 360px) {
      .app { padding-bottom: calc(68px + var(--safe-bottom)); }
      .page { padding: 10px 12px; }
      .header { padding: 10px 12px 6px; }
    }

    /* ===== Warehouse / Drawer ===== */
    /* ===== Warehouse Side Panel ===== */
    .warehouse-panel {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: var(--warehouse-width, 340px);
      background: linear-gradient(180deg, rgba(247,245,240,0.92) 0%, rgba(247,245,240,0.88) 100%);
      z-index: 150;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column;
      border-right: 1px solid var(--rule);
      box-shadow: 2px 0 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .warehouse-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('bg-sidebar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.32;
      z-index: 0;
      pointer-events: none;
    }
    .warehouse-panel > * {
      position: relative;
      z-index: 1;
    }
    .warehouse-panel.open { transform: translateX(0); }

    /* 侧边栏拖拽调整手柄 */
    .panel-resizer {
      position: absolute; top: 0; right: -3px; bottom: 0;
      width: 6px;
      cursor: col-resize;
      z-index: 200;
      transition: background 0.2s;
    }
    .panel-resizer:hover,
    .panel-resizer.dragging {
      background: rgba(232, 137, 91, 0.3);
    }
    .panel-resizer::before {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 2px; height: 40px;
      border-radius: 2px;
      background: rgba(0,0,0,0.15);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .panel-resizer:hover::before,
    .panel-resizer.dragging::before {
      opacity: 1;
    }
    body.resizing { cursor: col-resize !important; user-select: none; }
    body.resizing * { cursor: col-resize !important; }

    /* 主内容区域右移，在右侧空间内保持居中 */
    .app {
      transition: padding 0.3s cubic-bezier(.4,0,.2,1), max-width 0.3s cubic-bezier(.4,0,.2,1), margin 0.3s cubic-bezier(.4,0,.2,1);
    }
    .tabbar {
      transition: left 0.3s cubic-bezier(.4,0,.2,1), width 0.3s cubic-bezier(.4,0,.2,1), max-width 0.3s cubic-bezier(.4,0,.2,1), transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    body.warehouse-open .app {
      margin-left: 0;
      margin-right: 0;
      padding-left: calc(var(--warehouse-width, 340px) + max(0px, (100% - var(--warehouse-width, 340px) - 500px) / 2));
      padding-right: max(0px, (100% - var(--warehouse-width, 340px) - 500px) / 2);
      max-width: 100%;
      box-sizing: border-box;
    }
    body.warehouse-open .tabbar {
      left: calc(var(--warehouse-width, 340px) + (100% - var(--warehouse-width, 340px)) / 2);
      transform: translateX(-50%);
      width: calc(100% - var(--warehouse-width, 340px));
      max-width: 500px;
    }

    .warehouse-panel-header {
      padding: 21px 18px 14px;
      border-bottom: 1px solid var(--rule);
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-shrink: 0;
    }
    .warehouse-panel-title {
      font-size: 17px; font-weight: 700; color: var(--ink);
      display: none;
    }
    .warehouse-back-btn {
      width: 28px; height: 28px;
      border: none; background: none;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      border-radius: 6px; font-size: 22px;
      font-weight: 300; line-height: 1;
    }
    .warehouse-back-btn:hover { background: var(--accent-light); color: var(--accent); }
    .warehouse-close-btn {
      width: 28px; height: 28px;
      border: none; background: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      border-radius: 6px; font-size: 18px;
      line-height: 1;
      transition: background 0.15s, color 0.15s;
    }
    .warehouse-close-btn:hover { background: var(--accent-light); color: var(--accent); }
    .warehouse-toggle-right {
      width: 36px; height: 36px;
      border: none; background: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink);
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      margin-left: auto;
    }
    .warehouse-toggle-right svg { width: 22px; height: 22px; }
    .warehouse-toggle-right:hover { background: rgba(0,0,0,0.05); color: var(--accent); }
    .warehouse-toggle-right:active { background: rgba(0,0,0,0.08); }
    .warehouse-sound-btn {
      width: 36px; height: 36px;
      border: none; background: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink);
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      font-size: 18px;
    }
    .warehouse-sound-btn:hover { background: rgba(0,0,0,0.05); color: var(--accent); }
    .warehouse-sound-btn:active { background: rgba(0,0,0,0.08); }
    .warehouse-sound-btn.muted { color: var(--muted); }

    /* 右侧内容收起状态 */
    body.right-collapsed .app {
      transform: translateX(100%);
      opacity: 0;
      pointer-events: none;
    }
    body.right-collapsed .tabbar {
      transform: translateX(200%);
      opacity: 0;
      pointer-events: none;
    }
    /* 右侧收起、侧边栏全屏时的背景图：contain 完整显示 */
    body.right-collapsed::before {
      background-size: contain;
      background-position: center;
      opacity: 0.32;
    }

    body.right-collapsed .warehouse-panel {
      width: 100% !important;
    }
    .app, .tabbar {
      transition: transform 0.3s cubic-bezier(.4,0,.2,1), opacity 0.3s ease;
    }
    .warehouse-panel {
      transition: transform 0.3s cubic-bezier(.4,0,.2,1), width 0.3s cubic-bezier(.4,0,.2,1);
    }

    /* 面板主体（可滚动） */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding: 12px 14px 16px;
      gap: 16px;
    }
    .panel-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }
    .panel-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-section-title-icon {
      font-size: 26px;
      display: inline-block;
      width: 30px;
      text-align: center;
    }
    .panel-section-title-icon.warehouse-icon {
      /* 静态钥匙，无动效 */
    }
    .panel-collapse-btn {
      width: 24px; height: 24px;
      border: none; background: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--muted);
      display: grid; place-items: center;
      border-radius: 4px;
      transition: all 0.2s;
      line-height: 1;
    }
    .panel-collapse-btn:hover { background: var(--accent-light); color: var(--accent); }
    .panel-section.collapsed .panel-collapse-btn { transform: rotate(-90deg); }
    .panel-section.collapsed .panel-section-content {
      display: none;
    }
    .panel-section-content {
      animation: slideDown 0.25s ease;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 视图切换 */
    .warehouse-view {
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .warehouse-view.active { display: flex; }

    /* 三个分类编辑区 — 竖向排列 */
    .warehouse-edit-block {
      background: rgba(255,255,255,0.32);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.45);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .warehouse-edit-title {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: rgba(232, 137, 91, 0.18);
      border-radius: var(--radius) var(--radius) 0 0;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-radius 0.2s ease;
    }
    .warehouse-edit-block.collapsed .warehouse-edit-title {
      border-radius: var(--radius);
    }
    .warehouse-collapse-arrow {
      font-size: 11px;
      transition: transform 0.2s ease;
      color: var(--muted);
      flex-shrink: 0;
    }
    .warehouse-edit-block.collapsed .warehouse-collapse-arrow {
      transform: rotate(-90deg);
    }
    .warehouse-edit-title > span:nth-child(2) {
      flex: 1;
    }
    .warehouse-edit-content {
      overflow: hidden;
      max-height: 1000px;
      transition: max-height 0.3s ease, opacity 0.2s ease;
      position: relative;
    }
    .warehouse-edit-block.collapsed .warehouse-edit-content {
      max-height: 0;
      opacity: 0;
    }

    /* 调整大小手柄 */
    .warehouse-resize-handle {
      height: 10px;
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      position: relative;
      transition: background 0.2s ease;
    }
    .warehouse-resize-handle::before {
      content: '';
      width: 40px;
      height: 4px;
      border-radius: 2px;
      background: var(--rule);
      transition: background 0.2s ease;
    }
    .warehouse-resize-handle:hover::before,
    .warehouse-resize-handle.active::before {
      background: var(--accent);
    }
    .warehouse-resize-handle:hover {
      background: rgba(232, 137, 91, 0.05);
    }
    .warehouse-edit-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .warehouse-copy-btn {
      width: 22px; height: 22px;
      border: none; background: rgba(255,255,255,0.6);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      display: grid; place-items: center;
      transition: all 0.15s;
    }
    .warehouse-copy-btn:hover { background: #fff; transform: scale(1.1); }
    .warehouse-copy-btn.copied { background: #4CAF50; color: #fff; }
    .warehouse-edit-textarea {
      width: 100%;
      border: none;
      outline: none;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
      background: transparent;
      color: var(--ink);
      resize: none;
      font-family: inherit;
      height: 120px;
      min-height: 60px;
      border-radius: 0;
      box-sizing: border-box;
    }
    .warehouse-edit-textarea::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    /* 圆点列表编辑器 */
    .warehouse-bullet-list {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink);
      min-height: 60px;
      height: 120px;
      overflow-y: auto;
      border-radius: 0;
      box-sizing: border-box;
    }
    .warehouse-bullet-list:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
      pointer-events: none;
      display: block;
      padding: 0;
      line-height: 1.6;
    }
    .bullet-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 2px 0;
    }
    .bullet-dot {
      flex-shrink: 0;
      width: 16px;
      text-align: center;
      line-height: 1.6;
      color: var(--accent);
      user-select: none;
    }
    .bullet-text {
      flex: 1;
      min-width: 0;
      outline: none;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .bullet-text:empty::before {
      content: '\00a0'; /* 保持高度 */
    }

    /* 全部视图中的圆点列表 */
    .warehouse-all-item-bullet-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      height: 100px;
      min-height: 60px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink);
    }
    .warehouse-all-item-bullet-list .bullet-item {
      padding: 2px 0;
    }

    /* 全部视图中的圆点编辑器 */
    .warehouse-all-bullet-editor {
      background: var(--bg-soft);
      border-radius: var(--radius);
      min-height: 80px;
      max-height: 300px;
    }

    /* 查看全部按钮 */
    .warehouse-view-all-btn {
      flex-shrink: 0;
      padding: 12px 8px;
      border: 1px dashed var(--rule);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: fit-content;
      min-width: 80px;
      align-self: center;
    }
    .warehouse-view-all-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }
    .view-all-icon {
      display: inline-block;
      font-size: 28px;
      animation: bounce 2s ease-in-out infinite;
      line-height: 1;
    }
    .view-all-text {
      font-size: 12px;
      font-weight: 500;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    /* 全部视图 */
    .warehouse-all-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .warehouse-all-back-btn {
      width: 28px; height: 28px;
      border: none; background: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted);
      border-radius: 6px; font-size: 22px;
      font-weight: 300; line-height: 1;
      font-family: inherit;
      transition: all 0.15s;
    }
    .warehouse-all-back-btn:hover { background: var(--accent-light); color: var(--accent); }
    .warehouse-all-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .warehouse-all-title-icon {
      font-size: 17px;
      display: inline-block;
    }
    .warehouse-all-content { display: flex; flex-direction: column; gap: 12px; }
    /* 全部记录 — 按类型分区 */
    .warehouse-all-type-section {
      background: rgba(255,255,255,0.32);
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.45);
      backdrop-filter: blur(2px);
      overflow: hidden;
      flex-shrink: 0;
      margin-bottom: 12px;
    }
    .warehouse-all-type-section:last-child { margin-bottom: 0; }
    .warehouse-all-type-header {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: rgba(232, 137, 91, 0.18);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-radius 0.2s ease;
    }
    .warehouse-all-type-section.collapsed .warehouse-all-type-header {
      border-radius: var(--radius);
    }
    .warehouse-all-collapse-arrow {
      font-size: 11px;
      transition: transform 0.2s ease;
      color: var(--muted);
      flex-shrink: 0;
    }
    .warehouse-all-type-section.collapsed .warehouse-all-collapse-arrow {
      transform: rotate(-90deg);
    }
    .warehouse-all-type-title { display: flex; align-items: center; gap: 6px; }
    .warehouse-all-type-count {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
    }

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="./supabase.js"></script>
  <script>
    // ============ Data Layer ============
    const DB = {
      activities: [],
      reviews: [],
      plans: [],
      warehouse: {}, // key: "date|type", value: { content, updatedAt }
      timer: null, // { startTime: timestamp }
      customCats: [],
      deletedDefaultCats: [],
      customCatColorMap: {},
      defaultCats: ['工作','学习','运动','休息','生活','其他'],
      warehouseTypes: {
        reflection: { name: '吾日三省吾身', icon: '📝', placeholder: '今天有什么感悟？反思一下自己...' },
        miao: { name: '妙妙屋', icon: '✨', placeholder: '记录那些让你眼前一亮的奇妙与美好...' },
        thought: { name: '小念头', icon: '💡', placeholder: '突然冒出来的想法，记下来吧...' }
      },
      load() {
        try {
          this.activities = JSON.parse(localStorage.getItem('tt_activities') || '[]');
          this.reviews = JSON.parse(localStorage.getItem('tt_reviews') || '[]');
          this.plans = JSON.parse(localStorage.getItem('tt_plans') || '[]');
          this.warehouse = JSON.parse(localStorage.getItem('tt_warehouse') || '{}');
          this.anchors = JSON.parse(localStorage.getItem('tt_anchors') || '[]');
          const savedTimer = JSON.parse(localStorage.getItem('tt_timer') || 'null');
          if (savedTimer && typeof savedTimer === 'object') {
            this.timer = { startTime: savedTimer.startTime || null, updatedAt: savedTimer.updatedAt || (savedTimer.startTime || 0) };
          } else {
            this.timer = { startTime: null, updatedAt: 0 };
          }
          this.customCats = JSON.parse(localStorage.getItem('tt_customCats') || '[]');
          this.deletedDefaultCats = JSON.parse(localStorage.getItem('tt_deletedDefaultCats') || '[]');
          this.customCatColorMap = JSON.parse(localStorage.getItem('tt_customCatColorMap') || '{}');
          this.catOrder = JSON.parse(localStorage.getItem('tt_catOrder') || '[]');
        } catch(e) { this.activities = []; this.reviews = []; this.plans = []; this.warehouse = {}; this.anchors = []; this.timer = null; this.customCats = []; this.deletedDefaultCats = []; this.customCatColorMap = {}; this.catOrder = []; }
      },
      save() {
        localStorage.setItem('tt_activities', JSON.stringify(this.activities));
        localStorage.setItem('tt_reviews', JSON.stringify(this.reviews));
        localStorage.setItem('tt_plans', JSON.stringify(this.plans));
        Sync.debouncedPush();
      },
      saveWarehouse() {
        localStorage.setItem('tt_warehouse', JSON.stringify(this.warehouse));
        Sync.debouncedPush();
      },
      getWarehouseKey(date, type) { return date + '|' + type; },
      getWarehouseContent(date, type) {
        const key = this.getWarehouseKey(date, type);
        return this.warehouse[key] ? this.warehouse[key].content : '';
      },
      setWarehouseContent(date, type, content) {
        const key = this.getWarehouseKey(date, type);
        const trimmed = content.trim();
        if (!trimmed) {
          delete this.warehouse[key];
        } else {
          this.warehouse[key] = { content: trimmed, updatedAt: Date.now() };
        }
        this.saveWarehouse();
      },
      getWarehouseDates() {
        const dateSet = new Set();
        Object.keys(this.warehouse).forEach(k => {
          const [date] = k.split('|');
          dateSet.add(date);
        });
        return Array.from(dateSet).sort((a, b) => b.localeCompare(a));
      },
      getWarehouseByDate(date) {
        const result = {};
        ['reflection', 'miao', 'thought'].forEach(type => {
          const key = this.getWarehouseKey(date, type);
          result[type] = this.warehouse[key] ? this.warehouse[key].content : '';
        });
        return result;
      },
      // 按类型获取所有记录，按更新时间倒序
      getWarehouseByType(type) {
        const result = [];
        Object.keys(this.warehouse).forEach(k => {
          const [date, t] = k.split('|');
          if (t === type && this.warehouse[k]) {
            result.push({
              date,
              content: this.warehouse[k].content,
              updatedAt: this.warehouse[k].updatedAt || 0
            });
          }
        });
        return result.sort((a, b) => b.updatedAt - a.updatedAt);
      },
      // Anchors (我的锚点)
      saveAnchors() {
        localStorage.setItem('tt_anchors', JSON.stringify(this.anchors));
        Sync.debouncedPush();
      },
      getAnchorsByDate(date) {
        return this.anchors.filter(a => a.date === date).sort((a,b) => (a.order||0) - (b.order||0));
      },
      addAnchor(date, text) {
        const now = Date.now();
        const anchor = {
          id: now.toString(36) + Math.random().toString(36).slice(2,6),
          date, text, done: false, order: this.anchors.filter(a => a.date === date).length,
          updatedAt: now
        };
        this.anchors.push(anchor);
        this.saveAnchors();
        return anchor;
      },
      toggleAnchor(id) {
        const a = this.anchors.find(x => x.id === id);
        if (a) { a.done = !a.done; a.updatedAt = Date.now(); this.saveAnchors(); }
      },
      deleteAnchor(id) {
        this.anchors = this.anchors.filter(a => a.id !== id);
        this.saveAnchors();
      },
      updateAnchor(id, newText) {
        const a = this.anchors.find(x => x.id === id);
        if (a) { a.text = newText; a.updatedAt = Date.now(); this.saveAnchors(); }
      },
      reorderAnchors(date, newOrderIds) {
        const now = Date.now();
        newOrderIds.forEach((id, i) => {
          const a = this.anchors.find(x => x.id === id);
          if (a) { a.order = i; a.updatedAt = now; }
        });
        this.saveAnchors();
      },
      saveCustomCats() {
        localStorage.setItem('tt_customCats', JSON.stringify(this.customCats));
        Sync.debouncedPush();
      },
      saveCustomCatColorMap() {
        localStorage.setItem('tt_customCatColorMap', JSON.stringify(this.customCatColorMap));
        Sync.debouncedPush();
      },
      assignCatColor(cat) {
        if (this.customCatColorMap[cat] === undefined) {
          const used = new Set(Object.values(this.customCatColorMap));
          let idx = 0;
          while (used.has(idx)) idx++;
          this.customCatColorMap[cat] = idx;
          this.saveCustomCatColorMap();
        }
      },
      saveDeletedDefaultCats() {
        localStorage.setItem('tt_deletedDefaultCats', JSON.stringify(this.deletedDefaultCats));
        Sync.debouncedPush();
      },
      getAllCats() {
        const all = [...this.defaultCats.filter(c => !this.deletedDefaultCats.includes(c)), ...this.customCats];
        // 按自定义顺序排序
        if (this.catOrder && this.catOrder.length > 0) {
          all.sort((a, b) => {
            const ia = this.catOrder.indexOf(a);
            const ib = this.catOrder.indexOf(b);
            if (ia === -1 && ib === -1) return 0;
            if (ia === -1) return 1;
            if (ib === -1) return -1;
            return ia - ib;
          });
        }
        return all;
      },
      saveCatOrder() {
        localStorage.setItem('tt_catOrder', JSON.stringify(this.catOrder));
        Sync.debouncedPush();
      },
      deleteCat(cat) {
        if (this.defaultCats.includes(cat)) {
          if (!this.deletedDefaultCats.includes(cat)) this.deletedDefaultCats.push(cat);
          this.saveDeletedDefaultCats();
        } else if (this.customCats.includes(cat)) {
          this.customCats = this.customCats.filter(c => c !== cat);
          this.saveCustomCats();
        }
        // 从排序中移除
        if (this.catOrder) {
          this.catOrder = this.catOrder.filter(c => c !== cat);
          this.saveCatOrder();
        }
      },
      saveTimer() {
        localStorage.setItem('tt_timer', JSON.stringify(this.timer));
      },
      addActivity(act) {
        act.id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        act.updatedAt = Date.now();
        this.activities.push(act);
        this.activities.sort((a,b) => a.startTime.localeCompare(b.startTime));
        this.save();
      },
      deleteActivity(id) {
        this.activities = this.activities.filter(a => a.id !== id);
        this.save();
      },
      getPlansByDate(date) {
        return this.plans.filter(p => p.date === date).sort((a,b) => (a.order||0) - (b.order||0));
      },
      addPlan(date, text) {
        const now = Date.now();
        const plan = {
          id: now.toString(36) + Math.random().toString(36).slice(2,6),
          date, text, done: false, order: this.plans.filter(p => p.date === date).length,
          updatedAt: now
        };
        this.plans.push(plan);
        this.save();
        return plan;
      },
      togglePlan(id) {
        const p = this.plans.find(x => x.id === id);
        if (p) { p.done = !p.done; p.updatedAt = Date.now(); this.save(); }
      },
      deletePlan(id) {
        this.plans = this.plans.filter(p => p.id !== id);
        this.save();
      },
      updatePlan(id, newText) {
        const p = this.plans.find(x => x.id === id);
        if (p) { p.text = newText; p.updatedAt = Date.now(); this.save(); }
      },
      reorderPlans(date, newOrderIds) {
        const now = Date.now();
        newOrderIds.forEach((id, i) => {
          const p = this.plans.find(x => x.id === id);
          if (p) { p.order = i; p.updatedAt = now; }
        });
        this.save();
      },
      getActivitiesByDate(date) {
        return this.activities.filter(a => a.date === date).sort((a,b) => a.startTime.localeCompare(b.startTime));
      },
      getActivitiesByDateRange(from, to) {
        return this.activities.filter(a => a.date >= from && a.date <= to);
      },
      getReview(date, type) {
        return this.reviews.find(r => r.date === date && r.type === type);
      },
      saveReview(review) {
        const idx = this.reviews.findIndex(r => r.date === review.date && r.type === review.type);
        if (idx >= 0) this.reviews[idx] = review;
        else this.reviews.push(review);
        this.save();
      },
      startTimer() {
        this.timer = { startTime: Date.now(), updatedAt: Date.now() };
        this.saveTimer();
      },
      stopTimer() {
        if (!this.timerActive()) return null;
        const start = new Date(this.timer.startTime);
        const end = new Date();
        const date = this.formatDate(start);
        const startTime = this.formatTime(start);
        const endTime = this.formatTime(end);
        const duration = Math.round((end - start) / 60000);
        this.timer = { startTime: null, updatedAt: Date.now() };
        this.saveTimer();
        return { date, startTime, endTime, duration };
      },
      cancelTimer() {
        this.timer = { startTime: null, updatedAt: Date.now() };
        this.saveTimer();
      },
      timerActive() {
        return this.timer && this.timer.startTime;
      },
      formatDate(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth()+1).padStart(2,'0');
        const dd = String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${dd}`;
      },
      formatTime(d) {
        const h = String(d.getHours()).padStart(2,'0');
        const m = String(d.getMinutes()).padStart(2,'0');
        return `${h}:${m}`;
      }
    };

    // ============ Sync Layer (Supabase) ============
    const Sync = {
      URL: 'https://hhyqgywcswcjzqokytqq.supabase.co',
      KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoeXFneXdjc3djanpxb2t5dHFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NjIxNzAsImV4cCI6MjEwNjEzODE3MH0.dd735tln7Om1ErOBs_Iw1bxi1e1Wed3vUB1coC5U8U0',
      client: null,
      deviceId: null,
      debounceTimer: null,
      syncing: false,
      ready: false,

      init() {
        try {
          if (typeof supabase === 'undefined') { console.warn('Supabase SDK not loaded'); return; }
          this.client = supabase.createClient(this.URL, this.KEY);
          this.deviceId = localStorage.getItem('tt_device_id');
          if (!this.deviceId) {
            this.deviceId = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
            localStorage.setItem('tt_device_id', this.deviceId);
          }
          this.ready = true;
        } catch(e) { console.warn('Sync init failed:', e); }
      },

      async push() {
        if (!this.ready || this.syncing) return;
        this.syncing = true;
        try {
          const snap = JSON.parse(localStorage.getItem('tt_sync_snap') || '{}');
          const currentIds = [...DB.activities.map(a => a.id), ...DB.plans.map(p => p.id), ...DB.anchors.map(a => a.id), ...Object.keys(DB.warehouse)];
          const lastIds = snap.ids || [];
          const newlyDeleted = lastIds.filter(id => !currentIds.includes(id));
          const allDeleted = [...new Set([...newlyDeleted, ...(snap.deletedIds || [])])].filter(id => !currentIds.includes(id));

          const payload = {
            activities: DB.activities,
            reviews: DB.reviews,
            plans: DB.plans,
            warehouse: DB.warehouse,
            anchors: DB.anchors,
            customCats: DB.customCats,
            deletedDefaultCats: DB.deletedDefaultCats,
            customCatColorMap: DB.customCatColorMap,
            catOrder: DB.catOrder || [],
            deletedIds: allDeleted,
            timer: DB.timer
          };

          await this.client.from('time_tracker_data').delete().eq('device_id', this.deviceId).eq('data_type', 'snapshot');
          const { error } = await this.client.from('time_tracker_data').insert({
            device_id: this.deviceId, data_type: 'snapshot', data_key: 'all', data_value: payload
          });
          if (error) throw error;

          localStorage.setItem('tt_sync_snap', JSON.stringify({ ids: currentIds, deletedIds: allDeleted }));
          this.updateStatus('synced');
        } catch(e) {
          console.warn('Sync push failed:', e);
          this.updateStatus('error');
        }
        this.syncing = false;
      },

      async pull() {
        if (!this.ready) return false;
        this.syncing = true;
        this.updateStatus('syncing');
        try {
          const { data, error } = await this.client.from('time_tracker_data')
            .select('data_value').eq('data_type', 'snapshot');
          if (error) throw error;
          if (!data || data.length === 0) { this.syncing = false; this.updateStatus('synced'); return false; }

          // 先把本地数据放入合并结果
          const mergedAct = new Map(DB.activities.map(a => [a.id, a]));
          const mergedRev = new Map(DB.reviews.map(r => [r.date + '|' + r.type, r]));
          const mergedPlans = new Map(DB.plans.map(p => [p.id, p]));
          const mergedAnchors = new Map(DB.anchors.map(a => [a.id, a]));
          const mergedWarehouse = { ...DB.warehouse };
          const mergedCats = new Set(DB.customCats);
          const mergedDelCats = new Set(DB.deletedDefaultCats);
          const mergedColorMap = { ...DB.customCatColorMap };
          let mergedCatOrder = DB.catOrder || [];
          const allDeleted = new Set();
          let mergedTimer = DB.timer || { startTime: null, updatedAt: 0 };

          for (const row of data) {
            const v = row.data_value;
            if (!v) continue;
            if (v.deletedIds) v.deletedIds.forEach(id => allDeleted.add(id));
          }
          // 先收集所有删除标记，再合并数据（已删除的不合并）
          for (const row of data) {
            const v = row.data_value;
            if (!v) continue;
            if (v.activities) v.activities.forEach(a => {
              if (allDeleted.has(a.id)) return;
              const existing = mergedAct.get(a.id);
              if (!existing || (a.updatedAt || 0) > (existing.updatedAt || 0)) {
                mergedAct.set(a.id, a);
              }
            });
            if (v.reviews) v.reviews.forEach(r => { if (!allDeleted.has(r.date + '|' + r.type)) mergedRev.set(r.date + '|' + r.type, r); });
            if (v.plans) v.plans.forEach(p => {
              if (allDeleted.has(p.id)) return;
              const existing = mergedPlans.get(p.id);
              if (!existing || (p.updatedAt || 0) > (existing.updatedAt || 0)) {
                mergedPlans.set(p.id, p);
              }
            });
            if (v.anchors) v.anchors.forEach(a => {
              if (allDeleted.has(a.id)) return;
              const existing = mergedAnchors.get(a.id);
              if (!existing || (a.updatedAt || 0) > (existing.updatedAt || 0)) {
                mergedAnchors.set(a.id, a);
              }
            });
            if (v.warehouse) Object.keys(v.warehouse).forEach(key => {
              if (allDeleted.has(key)) return;
              const existing = mergedWarehouse[key];
              const incoming = v.warehouse[key];
              if (!existing || (incoming.updatedAt || 0) > (existing.updatedAt || 0)) {
                mergedWarehouse[key] = incoming;
              }
            });
            if (v.customCats) v.customCats.forEach(c => mergedCats.add(c));
            if (v.deletedDefaultCats) v.deletedDefaultCats.forEach(c => mergedDelCats.add(c));
            if (v.customCatColorMap) Object.assign(mergedColorMap, v.customCatColorMap);
            // catOrder: 使用最新的（长度更长的优先）
            if (v.catOrder && v.catOrder.length > mergedCatOrder.length) {
              mergedCatOrder = v.catOrder;
            }
            // timer: 取 updatedAt 最新的
            if (v.timer && typeof v.timer === 'object') {
              const incomingTime = v.timer.updatedAt || (v.timer.startTime || 0);
              const currentTime = mergedTimer.updatedAt || (mergedTimer.startTime || 0);
              if (incomingTime > currentTime) {
                mergedTimer = { startTime: v.timer.startTime || null, updatedAt: incomingTime };
              }
            }
          }
          // 最后应用删除标记
          allDeleted.forEach(id => {
            mergedAct.delete(id);
            mergedPlans.delete(id);
            mergedAnchors.delete(id);
            delete mergedWarehouse[id];
          });

          DB.activities = Array.from(mergedAct.values()).sort((a, b) => a.startTime.localeCompare(b.startTime));
          DB.reviews = Array.from(mergedRev.values());
          DB.plans = Array.from(mergedPlans.values());
          DB.anchors = Array.from(mergedAnchors.values());
          DB.warehouse = mergedWarehouse;
          DB.customCats = Array.from(mergedCats);
          DB.deletedDefaultCats = Array.from(mergedDelCats);
          DB.customCatColorMap = mergedColorMap;
          DB.catOrder = mergedCatOrder;
          DB.timer = mergedTimer;
          DB.saveTimer();

          DB.save(); DB.saveWarehouse(); DB.saveAnchors(); DB.saveCustomCats(); DB.saveCustomCatColorMap(); DB.saveDeletedDefaultCats(); DB.saveCatOrder();
          updateCustomCatStyles();

          const currentIds = [...DB.activities.map(a => a.id), ...DB.plans.map(p => p.id), ...DB.anchors.map(a => a.id), ...Object.keys(DB.warehouse)];
          localStorage.setItem('tt_sync_snap', JSON.stringify({
            ids: currentIds,
            deletedIds: Array.from(allDeleted).filter(id => !currentIds.includes(id))
          }));
          this.syncing = false;
          this.updateStatus('synced');
          return true;
        } catch(e) {
          console.warn('Sync pull failed:', e);
          this.updateStatus('error');
          this.syncing = false;
          return false;
        }
      },

      debouncedPush() {
        if (!this.ready) return;
        clearTimeout(this.debounceTimer);
        this.debounceTimer = setTimeout(() => this.push(), 2000);
      },

      updateStatus(status) {
        const el = document.getElementById('syncStatus');
        if (!el) return;
        if (status === 'syncing') { el.textContent = '同步中…'; el.style.color = '#89bceb'; }
        else if (status === 'synced') { el.textContent = '已同步'; el.style.color = '#7fb069'; }
        else if (status === 'error') { el.textContent = '同步失败'; el.style.color = 'var(--danger)'; }
      }
    };

    // ============ State ============
    let currentDate = new Date();
    let currentPage = 'Day';
    let selectedCategories = []; // 数组，第一个为主标签
    let planCollapsed = false;
    let highlightEventId = null;
    let clockInterval = null;
    let timerInterval = null;

    const CAT_COLORS = {
      '工作': '#c96a3a', '学习': '#4a7a3a', '运动': '#4a7a35',
      '休息': '#a87818', '生活': '#b04a3f', '其他': '#7a6d5e'
    };
    const CAT_RGB = {
      '工作': '232,137,91', '学习': '127,176,105', '运动': '107,158,78',
      '休息': '232,168,56', '生活': '217,102,90', '其他': '168,152,136'
    };
    const EXTRA_COLORS = ['#6b8fa3','#9b6bb0','#5e9eab','#c97890','#7a9e5e','#b07d20','#5d7a8c','#a8755e'];
    const EXTRA_RGB = ['107,143,163','155,107,176','94,158,171','201,120,144','122,158,94','176,125,32','93,122,140','168,117,94'];
    // 获取活动的主标签（第一个标签），兼容旧数据
    function getPrimaryCat(act) {
      if (act.categories && act.categories.length > 0) return act.categories[0];
      return act.category || '其他';
    }
    // 获取活动的所有标签
    function getActCats(act) {
      if (act.categories && act.categories.length > 0) return act.categories;
      if (act.category) return [act.category];
      return ['其他'];
    }
    function getCatColor(cat) {
      if (CAT_COLORS[cat]) return CAT_COLORS[cat];
      const idx = DB.customCatColorMap[cat];
      if (idx !== undefined) return EXTRA_COLORS[idx % EXTRA_COLORS.length];
      return '#888888';
    }
    function getCatRGB(cat) {
      if (CAT_RGB[cat]) return CAT_RGB[cat];
      const idx = DB.customCatColorMap[cat];
      if (idx !== undefined) return EXTRA_RGB[idx % EXTRA_RGB.length];
      return '136,136,136';
    }
    function catRgba(cat, alpha) {
      return `rgba(${getCatRGB(cat)},${alpha})`;
    }
    function lightenColor(hex, percent) {
      // 将hex颜色变浅，percent为0-1之间的值
      const num = parseInt(hex.replace('#', ''), 16);
      const r = (num >> 16) + Math.round((255 - (num >> 16)) * percent);
      const g = ((num >> 8) & 0x00FF) + Math.round((255 - ((num >> 8) & 0x00FF)) * percent);
      const b = (num & 0x0000FF) + Math.round((255 - (num & 0x0000FF)) * percent);
      return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
    }
    function updateCustomCatStyles() {
      const el = document.getElementById('customCatStyles');
      if (!el) return;
      let css = '';
      Object.keys(DB.customCatColorMap).forEach(cat => {
        const color = getCatColor(cat);
        const rgb = getCatRGB(cat);
        css += `.timeline-item[data-cat="${cat}"]::before { background: ${color}; box-shadow: 0 0 0 1px ${color}; }\n`;
        css += `.tag[data-cat="${cat}"] { background: rgba(${rgb},0.28); color: ${color}; }\n`;
      });
      el.textContent = css;
    }
    const WEEKDAYS = ['日','一','二','三','四','五','六'];

    // ============ Utils ============
    function fmtDate(d) { return DB.formatDate(d); }
    function fmtDuration(min) {
      if (min < 60) return `${min}分钟`;
      const h = Math.floor(min/60);
      const m = min%60;
      return m ? `${h}小时${m}分` : `${h}小时`;
    }
    function fmtDateLabel(date) {
      const d = new Date(date);
      d.setHours(0,0,0,0);
      const today = new Date();
      today.setHours(0,0,0,0);
      const diff = Math.round((today - d) / 86400000);
      if (diff === 0) return '今天';
      if (diff === 1) return '昨天';
      if (diff === -1) return '明天';
      return `${d.getMonth()+1}月${d.getDate()}日`;
    }
    function getWeekRange(d) {
      const day = d.getDay();
      const monday = new Date(d);
      monday.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { monday, sunday };
    }
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    }
    function getNowTime() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2,'0');
      const m = String(d.getMinutes()).padStart(2,'0');
      return `${h}:${m}`;
    }
    function getNowSeconds() {
      const d = new Date();
      const s = String(d.getSeconds()).padStart(2,'0');
      return s;
    }

    // ============ Render: Header ============
    function renderHeader() {
      const titleEl = document.getElementById('headerTitle');
      const dateEl = document.getElementById('headerDate');
      const d = new Date(currentDate);

      if (currentPage === 'Day') {
        titleEl.textContent = fmtDateLabel(d);
        dateEl.textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${WEEKDAYS[d.getDay()]}`;
      } else if (currentPage === 'Week') {
        const { monday, sunday } = getWeekRange(d);
        const nowWeek = getWeekRange(new Date());
        const norm = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
        const mNorm = norm(monday), nwNorm = norm(nowWeek.monday), sNorm = norm(sunday);
        const isThisWeek = mNorm.getTime() === nwNorm.getTime();
        const isPast = sNorm < nwNorm;
        titleEl.textContent = isThisWeek ? '本周' : (isPast ? '往周' : '预周');
        dateEl.textContent = `${monday.getMonth()+1}/${monday.getDate()} - ${sunday.getMonth()+1}/${sunday.getDate()}`;
      } else if (currentPage === 'Month') {
        const now = new Date();
        const isThisMonth = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
        const isPast = d < new Date(now.getFullYear(), now.getMonth(), 1);
        titleEl.textContent = isThisMonth ? '本月' : (isPast ? '往月' : '预月');
        dateEl.textContent = `${d.getFullYear()}年${d.getMonth()+1}月`;
      } else if (currentPage === 'Stats') {
        titleEl.textContent = '统计';
        dateEl.textContent = '时间分布与趋势';
      } else if (currentPage === 'Settings') {
        titleEl.textContent = '设置';
        dateEl.innerHTML = '&nbsp;';
      }
    }

    // ============ Render: Timer Widget (3 states) ============
    function renderTimer() {
      const el = document.getElementById('timerWidget');
      // const badge = document.getElementById('timerBadge');

      if (!DB.timerActive()) {
        // State 1: Idle - show clock + start button
        // badge.classList.remove('show');
        el.innerHTML = `

            <div class="timer-clock-label">现在时间</div>
            <div class="timer-clock">
              <span id="clockTime">${getNowTime()}</span>
            </div>
            <div class="timer-sub">点击开始记录你接下来要做的事</div>
            <button class="timer-big-btn start" id="timerStartBtn">开 始 记 录</button>

        `;
        document.getElementById('timerStartBtn').addEventListener('click', () => {
          DB.startTimer();
          renderAll();
          Sync.debouncedPush();

        if (clockInterval) clearInterval(clockInterval);
        clockInterval = setInterval(() => {
          if (currentPage !== 'Day' || DB.timerActive()) return;
          const ct = document.getElementById('clockTime');
          if (ct) {
            ct.textContent = getNowTime();

      } else {
        // State 2: Running - show current time + stop button (no elapsed time to avoid pressure)
        // badge.classList.add('show');

        el.innerHTML = `
          <div class="timer-widget running">
            <div class="timer-clock-label recording">
              <span>现在时间</span>
              <span class="wave-bubble" title="记录中">
                <svg viewBox="0 0 52 22" xmlns="http://www.w3.org/2000/svg">
                  <!-- 小丑鱼身体（尾巴在左，头在右） -->
                  <g clip-path="url(#fishClip)">
                    <!-- 鱼身体底色 -->
                    <ellipse class="fish-body" cx="24" cy="11" rx="20" ry="8"/>
                    <!-- 尾鳍 -->
                    <path class="fish-body" d="M2 11L10 4L10 18Z"/>
                    <!-- 背鳍 -->
                    <path class="fish-body" d="M28 3Q32 1 36 3L36 6Q32 5 28 6Z"/>
                    <!-- 腹鳍 -->
                    <path class="fish-body" d="M28 19Q32 21 36 19L36 16Q32 17 28 16Z"/>
                    <!-- 白色条纹 -->
                    <rect class="fish-stripe" x="14" y="3" width="2.5" height="16" rx="1.25"/>
                    <rect class="fish-stripe" x="26" y="3" width="2.5" height="16" rx="1.25"/>
                    <!-- 水波流动 -->
                    <g class="wave-group" transform="translate(0, 2)">
                      <path d="M0 18 Q13 12 26 18 T52 18 V22 H0 Z" fill="rgba(255, 180, 120, 0.35)"/>
                      <path d="M52 18 Q65 12 78 18 T104 18 V22 H52 Z" fill="rgba(255, 180, 120, 0.35)"/>
                    </g>
                    <g class="wave-group-2" transform="translate(0, 5)">
                      <path d="M0 18 Q13 14 26 18 T52 18 V22 H0 Z" fill="rgba(255, 140, 80, 0.3)"/>
                      <path d="M52 18 Q65 14 78 18 T104 18 V22 H52 Z" fill="rgba(255, 140, 80, 0.3)"/>
                    </g>
                    <!-- 气泡 -->
                    <circle class="bubble-1" cx="18" cy="18" r="1.5" fill="rgba(255, 245, 230, 0.85)"/>
                    <circle class="bubble-2" cx="26" cy="18" r="1.2" fill="rgba(255, 245, 230, 0.8)"/>
                    <circle class="bubble-3" cx="34" cy="18" r="2" fill="rgba(255, 245, 230, 0.9)"/>
                    <!-- 眼睛 -->

                  </g>
                  <defs>
                    <clipPath id="fishClip">
                      <!-- 鱼身轮廓 -->
                      <ellipse cx="24" cy="11" rx="20" ry="8"/>
                      <path d="M2 11L10 4L10 18Z"/>
                      <path d="M28 3Q32 1 36 3L36 6Q32 5 28 6Z"/>
                      <path d="M28 19Q32 21 36 19L36 16Q32 17 28 16Z"/>
                    </clipPath>
                  </defs>
                </svg>
              </span>
            </div>
            <div class="timer-clock">
              <span id="clockTime">${getNowTime()}</span>
            </div>
            <div class="timer-btn-row">
              <button class="timer-big-btn stop" id="timerStopBtn" style="margin-top:0">我 完 成 啦</button>
              <button class="timer-rst-btn" id="timerRstBtn" title="双击复位">RST</button>
            </div>
          </div>
        `;

        // Start clock ticking for running state too
        if (clockInterval) clearInterval(clockInterval);
        clockInterval = setInterval(() => {
          if (currentPage !== 'Day' || !DB.timerActive()) return;
          const ct = document.getElementById('clockTime');
          if (ct) {
            ct.textContent = getNowTime();
          }
        }, 1000);

        document.getElementById('timerStopBtn').addEventListener('click', async () => {
          // 停止前先同步，确保拿到其他设备最新的计时器状态
          if (Sync.ready) {
            try {
              await Sync.pull();
            } catch(e) { console.warn('Pre-stop sync pull failed:', e); }
          }
          // Stop timer and open sheet to fill in details
          sheetTimerBackup = { ...DB.timer };
          const timing = DB.stopTimer();
          if (!timing) return;
          if (timing.duration < 1) {
            sheetTimerBackup = null;
            toast('时间太短，未记录');
            renderAll();
            Sync.debouncedPush();
            return;
          }
          // Open sheet pre-filled with timing data
          openSheetWithTimer(timing);
          Sync.debouncedPush();
        });

        document.getElementById('timerRstBtn').addEventListener('dblclick', () => {
          DB.cancelTimer();
          sheetTimerBackup = null;
          renderAll();
          Sync.debouncedPush();
        });

        // Start timer ticking
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (!DB.timerActive()) { clearInterval(timerInterval); timerInterval = null; return; }
          const elapsed = Math.floor((Date.now() - DB.timer.startTime) / 1000);
          const h = Math.floor(elapsed / 3600);
          const m = Math.floor((elapsed % 3600) / 60);
          const s = elapsed % 60;
          const display = h > 0
            ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
            : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
          const el = document.getElementById('timerElapsed');
          if (el) el.textContent = display;
        }, 1000);
      }
    }

    // ============ Render: Day Page ============
    function renderDay() {
      const dateStr = fmtDate(currentDate);
      renderDayPlan(dateStr);

      const acts = DB.getActivitiesByDate(dateStr);
      const tl = document.getElementById('dayTimeline');

      if (acts.length === 0) {
        tl.innerHTML = `<div class="card"><div class="card-title-row"><div class="card-title">0条记录</div><button class="tl-add-btn" id="tlAddBtn" title="手动添加">+</button></div><div class="empty"><div class="empty-icon">📝</div><div class="empty-text">还没有记录<br>点击「开始记录」或 + 手动添加</div></div></div>`;
      } else {
        tl.innerHTML = `<div class="card"><div class="card-title-row"><div class="card-title">${acts.length}条记录 · 共${fmtDuration(acts.reduce((s,a)=>s+a.duration,0))}</div><button class="tl-add-btn" id="tlAddBtn" title="手动添加">+</button></div><div class="timeline">${acts.map(a => {
          const cats = getActCats(a);
          const primaryCat = getPrimaryCat(a);
          return `
          <div class="timeline-item" data-cat="${primaryCat}" data-id="${a.id}">
            <button class="del-btn" data-id="${a.id}">×</button>
            <div class="timeline-time" data-id="${a.id}" title="双击编辑">${a.startTime} - ${a.endTime} · ${fmtDuration(a.duration)}</div>
            <div class="timeline-meta" data-id="${a.id}" title="双击编辑">${cats.map((c, i) => `<span class="tag${i === 0 ? ' tag-primary' : ''}" data-cat="${c}" style="background:${catRgba(c,0.28)};color:${getCatColor(c)};">${i === 0 ? '★ ' : ''}${c}</span>`).join('')}</div>
            ${a.note ? `<div class="timeline-note" data-id="${a.id}" title="双击编辑">${a.note}</div>` : ''}
          </div>
        `;}).join('')}</div></div>`;

        tl.querySelectorAll('.del-btn').forEach(btn => {
          btn.addEventListener('click', e => {
            e.stopPropagation();
            DB.deleteActivity(btn.dataset.id);
            renderDay();
            toast('已删除');
          });
        });

        // 双击时间段或标签区域：弹出编辑界面
        tl.querySelectorAll('.timeline-time, .timeline-meta').forEach(el => {
          el.addEventListener('dblclick', e => {
            e.stopPropagation();
            const id = el.dataset.id;
            openSheetForEdit(id);
          });
          el.style.cursor = 'pointer';
        });

        // 双击备注：直接编辑
        tl.querySelectorAll('.timeline-note').forEach(noteEl => {
          noteEl.addEventListener('dblclick', e => {
            e.stopPropagation();
            const id = noteEl.dataset.id;
            const originalText = noteEl.textContent;
            const textarea = document.createElement('textarea');
            textarea.className = 'timeline-note-edit';
            textarea.value = originalText;
            noteEl.replaceWith(textarea);
            textarea.focus();
            textarea.select();
            const save = () => {
              const val = textarea.value.trim();
              const act = DB.activities.find(a => a.id === id);
              if (act) { act.note = val; act.updatedAt = Date.now(); DB.save(); }
              renderDay();
            };
            textarea.addEventListener('keydown', ev => {
              if (ev.key === 'Escape') { ev.preventDefault(); renderDay(); }
            });
            textarea.addEventListener('blur', save);
          });
        });

        if (highlightEventId) {
          const target = tl.querySelector(`.timeline-item[data-id="${highlightEventId}"]`);
          if (target) {
            target.classList.add('highlight');
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          highlightEventId = null;
        }
