      document.getElementById('saveMonthReview').onclick = () => {
        const content = document.getElementById('monthReviewText').value.trim();
        const stars = ratingEl.querySelectorAll('.rating-star.active').length;
        DB.saveReview({ date: monthKey, type: 'monthly', content, rating: stars, createdAt: Date.now() });
        toast('已保存本月复盘');
      };

      if (pinnedReviews.month) document.getElementById('monthReviewCard').classList.add('pinned');
      if (pinnedReviews.month) document.getElementById('monthPinBtn').classList.add('active');
      if (pinnedReviews.month) document.getElementById('reviewPinOverlay').classList.add('show');
      if (pinnedReviews.month) document.querySelector('.app').classList.add('pin-active');
      document.getElementById('monthPinBtn').onclick = () => {
        pinnedReviews.month = !pinnedReviews.month;
        document.getElementById('monthReviewCard').classList.toggle('pinned', pinnedReviews.month);
        document.getElementById('monthPinBtn').classList.toggle('active', pinnedReviews.month);
        document.getElementById('reviewPinOverlay').classList.toggle('show', pinnedReviews.month);
        document.querySelector('.app').classList.toggle('pin-active', pinnedReviews.month);
      };
    }

    // ============ Render: Stats Page ============
    let trendChart = null;
    let barPeriod = 'month'; // day | week | month
    let trendPeriod = 'month'; // week | month
    let trendCats = []; // array of selected category names
    let customDateRange = null; // { start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' } when active

    function getStatsDateRange(period) {
      const now = new Date();
      let start, end;
      if (period === 'day') {
        start = new Date(now); end = new Date(now);
      } else if (period === 'week') {
        start = new Date(now); start.setDate(now.getDate() - 6); end = new Date(now);
      } else { // month
        start = new Date(now.getFullYear(), now.getMonth(), 1);
        end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      }
      return { start: fmtDate(start), end: fmtDate(end), startDate: start, endDate: end };
    }

    function getBarPeriodLabel() {
      return { day: '日维度', week: '周维度', month: '月维度' }[barPeriod];
    }
    function getTrendPeriodLabel() {
      return { week: '周维度', month: '月维度' }[trendPeriod];
    }

    function setupDropdown(btnId, dropdownId, onSelect, multiSelect, maxSelect) {
      const btn = document.getElementById(btnId);
      const dropdown = document.getElementById(dropdownId);
      if (!btn || !dropdown) return;

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== dropdownId) d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          const val = opt.dataset.val;
          onSelect(val, opt);
        };
      });
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.stats-filter-dropdown').forEach(d => d.classList.remove('show'));
    }
    document.addEventListener('click', closeAllDropdowns);

    function renderBarPeriodDropdown() {
      const btn = document.getElementById('barPeriodBtn');
      const dropdown = document.getElementById('barPeriodDropdown');
      const options = [
        { val: 'day', label: '日维度' },
        { val: 'week', label: '周维度' },
        { val: 'month', label: '月维度' }
      ];
      dropdown.innerHTML = options.map(o =>
        `<div class="stats-filter-option${barPeriod === o.val ? ' selected' : ''}" data-val="${o.val}">${o.label}</div>`
      ).join('');

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'barPeriodDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          barPeriod = opt.dataset.val;
          customDateRange = null;
          document.getElementById('barPeriodBtn').textContent = getBarPeriodLabel();
          document.getElementById('customDateBtn').textContent = '自定义';
          renderBars();
          closeAllDropdowns();
          renderBarPeriodDropdown();
        };
      });
    }

    function renderTrendPeriodDropdown() {
      const btn = document.getElementById('trendPeriodBtn');
      const dropdown = document.getElementById('trendPeriodDropdown');
      const options = [
        { val: 'week', label: '周维度' },
        { val: 'month', label: '月维度' }
      ];
      dropdown.innerHTML = options.map(o =>
        `<div class="stats-filter-option${trendPeriod === o.val ? ' selected' : ''}" data-val="${o.val}">${o.label}</div>`
      ).join('');

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'trendPeriodDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          trendPeriod = opt.dataset.val;
          document.getElementById('trendPeriodBtn').textContent = getTrendPeriodLabel();
          renderTrendCatDropdown();
          renderTrendChart();
          closeAllDropdowns();
          renderTrendPeriodDropdown();
        };
      });
    }

    function renderTrendCatDropdown() {
      const btn = document.getElementById('trendCatBtn');
      const dropdown = document.getElementById('trendCatDropdown');
      const allCats = DB.getAllCats();
      const selectedCount = trendCats.length;
      const allSelected = selectedCount === allCats.length;
      const noneSelected = selectedCount === 0;

      let html = `<div class="stats-filter-option${allSelected ? ' selected' : ''}" data-val="all">
        <span class="check">${allSelected ? '✓' : ''}</span>全部
      </div>`;
      allCats.forEach(cat => {
        const selected = trendCats.includes(cat);
        html += `<div class="stats-filter-option${selected ? ' selected' : ''}" data-val="${cat}">
          <span class="check">${selected ? '✓' : ''}</span>${cat}
        </div>`;
      });
      dropdown.innerHTML = html;

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'trendCatDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          const val = opt.dataset.val;
          if (val === 'all') {
            if (allSelected) {
              // 点击全选且当前全选中 -> 取消全选（默认选中第一个，避免空）
              trendCats = allCats.length > 0 ? [allCats[0]] : [];
            } else {
              // 点击全选但未全选 -> 全选
              trendCats = [...allCats];
            }
          } else {
            if (trendCats.includes(val)) {
              trendCats = trendCats.filter(c => c !== val);
              // 至少保留一个
              if (trendCats.length === 0) trendCats = [...allCats];
            } else {
              trendCats.push(val);
            }
          }
          // 更新按钮文字
          if (trendCats.length === allCats.length) btn.textContent = '全部';
          else if (trendCats.length === 1) btn.textContent = trendCats[0];
          else btn.textContent = `已选${trendCats.length}个`;
          renderTrendCatDropdown();
          renderTrendChart();
        };
      });
    }

    function renderStats() {
      const allCats = DB.getAllCats();
      // 初始化为全选
      if (trendCats.length === 0) trendCats = [...allCats];
      renderBarPeriodDropdown();
      renderTrendPeriodDropdown();
      renderTrendCatDropdown();
      document.getElementById('barPeriodBtn').textContent = getBarPeriodLabel();
      document.getElementById('trendPeriodBtn').textContent = getTrendPeriodLabel();
      const btn = document.getElementById('trendCatBtn');
      if (trendCats.length === allCats.length) btn.textContent = '全部';
      else if (trendCats.length === 1) btn.textContent = trendCats[0];
      else btn.textContent = `已选${trendCats.length}个`;
      setupCustomDatePicker();
      renderBars();
      renderTrendChart();
    }

    function setupCustomDatePicker() {
      const overlay = document.getElementById('customDateOverlay');
      const btn = document.getElementById('customDateBtn');
      const startInput = document.getElementById('customDateStart');
      const endInput = document.getElementById('customDateEnd');
      const confirmBtn = document.getElementById('customDateConfirm');
      const cancelBtn = document.getElementById('customDateCancel');

      btn.onclick = (e) => {
        e.stopPropagation();
        const today = fmtDate(new Date());
        startInput.value = customDateRange ? customDateRange.start : today;
        endInput.value = customDateRange ? customDateRange.end : today;
        overlay.classList.add('show');
      };

      cancelBtn.onclick = () => { overlay.classList.remove('show'); };
      overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('show'); };

      confirmBtn.onclick = () => {
        const start = startInput.value;
        const end = endInput.value;
        if (!start || !end) { toast('请选择起始和结束日期'); return; }
        if (start > end) { toast('结束日期需晚于或等于起始日期'); return; }
        customDateRange = { start, end };
        btn.textContent = `${start}~${end}`;
        overlay.classList.remove('show');
        renderBars();
      };
    }

    function renderBars() {
      let range, rangeLabel;
      if (customDateRange) {
        range = { start: customDateRange.start, end: customDateRange.end };
        rangeLabel = `${customDateRange.start} ~ ${customDateRange.end}`;
      } else {
        range = getStatsDateRange(barPeriod);
        rangeLabel = { day: '今日', week: '近7天', month: '本月' }[barPeriod];
      }
      const acts = DB.getActivitiesByDateRange(range.start, range.end);

      const catMinutes = {};
      acts.forEach(a => { catMinutes[a.category] = (catMinutes[a.category] || 0) + a.duration; });
      const totalMin = Object.values(catMinutes).reduce((s,v) => s + v, 0);

      const deco = document.getElementById('statsDeco');
      deco.innerHTML = `
        <div class="deco-title">数据统计</div>
        <div class="deco-sub">${rangeLabel} · ${acts.length}条记录 · ${fmtDuration(totalMin)}</div>
        <div class="deco-bubble" style="width:55px;height:55px;right:-10px;top:-10px"></div>
        <div class="deco-bubble" style="width:25px;height:25px;right:40px;bottom:-8px"></div>
      `;

      document.getElementById('statsTotalHours').textContent = fmtDuration(totalMin);

      const bars = document.getElementById('statsBars');
      const sortedCats = Object.entries(catMinutes).sort((a,b) => b[1] - a[1]);
      if (sortedCats.length === 0) {
        bars.innerHTML = '<div class="empty"><div class="empty-text">暂无数据</div></div>';
      } else {
        bars.innerHTML = sortedCats.map(([cat, min]) => {
          const pct = totalMin > 0 ? (min / totalMin * 100) : 0;
          const durText = fmtDuration(min);
          const catColor = getCatColor(cat);
          return `
            <div class="stats-bar-row">
              <div class="stats-bar-label">${cat}</div>
              <div class="stats-bar-track">
                <div class="stats-bar-colored" style="width:${pct}%;background:${catColor}"></div>
                <span class="stats-bar-text" style="left:calc(${pct}% + 6px);color:${catColor}">${durText}</span>
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('statsLegend').innerHTML =
        Object.keys(catMinutes).sort((a,b) => catMinutes[b] - catMinutes[a]).map(cat =>
          `<div class="stats-legend-item"><div class="stats-legend-dot" style="background:${getCatColor(cat)}"></div>${cat}</div>`
        ).join('');
    }

    function renderTrendChart() {
      const range = getStatsDateRange(trendPeriod);
      const acts = DB.getActivitiesByDateRange(range.start, range.end);
      const trendEl = document.getElementById('statsTrend');
      const allCats = DB.getAllCats();
      const isAllSelected = trendCats.length === allCats.length;

      let labels = [];
      let totalData = [];

      if (trendPeriod === 'week') {
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const ds = fmtDate(d);
          const dayActs = acts.filter(a => a.date === ds && trendCats.includes(a.category));
          const min = dayActs.reduce((s,a) => s + a.duration, 0);
          labels.push(`${d.getMonth()+1}/${d.getDate()}`);
          totalData.push(min);
        }
      } else { // month
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        for (let i = 1; i <= daysInMonth; i++) {
          const ds = fmtDate(new Date(now.getFullYear(), now.getMonth(), i));
          const dayActs = acts.filter(a => a.date === ds && trendCats.includes(a.category));
          const min = dayActs.reduce((s,a) => s + a.duration, 0);
          labels.push(`${i}日`);
          totalData.push(min);
        }
      }

      let datasets = [];

      if (isAllSelected || trendCats.length <= 1) {
        // 全选或单选时，显示柱状图 + 折线图（汇总）
        const barColor = isAllSelected ? '#c97890' : (trendCats.length === 1 ? getCatColor(trendCats[0]) : '#c97890');
        const lineColor = '#8ec1e0';
        datasets.push({
          type: 'bar',
          label: '时长',
          data: totalData,
          backgroundColor: barColor,
          borderRadius: 6,
          barPercentage: 0.6,
          yAxisID: 'y'
        });
        datasets.push({
          type: 'line',
          label: '趋势',
          data: totalData,
          borderColor: lineColor,
          backgroundColor: lineColor + '20',
          borderWidth: 2,
          pointRadius: 2,
          pointBackgroundColor: lineColor,
          pointBorderColor: lineColor,
          pointBorderWidth: 2,
          tension: 0.3,
          fill: true,
          yAxisID: 'y'
        });
      } else if (trendCats.length > 3) {
        // 选了超过3个标签：汇总成一根柱状图 + 一根折线图，图例展示所有选中标签名
        const lineColor = '#8ec1e0';
        datasets.push({
          type: 'bar',
          label: '汇总时长',
          data: totalData,
          backgroundColor: '#c97890',
          borderRadius: 6,
          barPercentage: 0.6,
          yAxisID: 'y'
        });
        datasets.push({
          type: 'line',
          label: '汇总趋势',
          data: totalData,
          borderColor: lineColor,
          backgroundColor: lineColor + '20',
          borderWidth: 2,
          pointRadius: 2,
          pointBackgroundColor: lineColor,
          pointBorderColor: lineColor,
          pointBorderWidth: 2,
          tension: 0.3,
          fill: true,
          yAxisID: 'y'
        });
      } else {
        // 多选2-3个标签时：每个分类一组柱状图 + 各自的折线图
        const barDatasets = [];
        const lineDatasets = [];
        trendCats.forEach(cat => {
          const catData = [];
          if (trendPeriod === 'week') {
            for (let i = 6; i >= 0; i--) {
              const d = new Date();
              d.setDate(d.getDate() - i);
              const ds = fmtDate(d);
              const min = acts.filter(a => a.date === ds && a.category === cat).reduce((s,a) => s + a.duration, 0);
              catData.push(min);
            }
          } else {
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
              const ds = fmtDate(new Date(now.getFullYear(), now.getMonth(), i));
              const min = acts.filter(a => a.date === ds && a.category === cat).reduce((s,a) => s + a.duration, 0);
              catData.push(min);
            }
          }
          const catColor = getCatColor(cat);
          const lightColor = lightenColor(catColor, 0.5);
          barDatasets.push({
            type: 'bar',
            label: cat,
            data: catData,
            backgroundColor: catColor,
            borderRadius: 4,
            barPercentage: 0.7,
            yAxisID: 'y'
          });
          lineDatasets.push({
            type: 'line',
            label: cat + '趋势',
            data: catData,
            borderColor: lightColor,
            borderWidth: 2,
            pointRadius: 2,
            pointBackgroundColor: lightColor,
            pointBorderColor: lightColor,
            pointBorderWidth: 2,
            tension: 0.3,
            fill: false,
            yAxisID: 'y'
          });
        });
        datasets = datasets.concat(barDatasets).concat(lineDatasets);
      }

      if (trendChart) trendChart.destroy();
      trendEl.innerHTML = '';
      const trendCtx = document.createElement('canvas');
      trendCtx.height = 200;
      trendEl.appendChild(trendCtx);

      // 自定义图例配置
      const legendConfig = { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12, boxHeight: 12, usePointStyle: false } };
      // 超过3个标签时，图例只展示所有选中的标签名（纯展示，不对应具体dataset）
      if (trendCats.length > 3 && !isAllSelected) {
        legendConfig.labels.generateLabels = function(chart) {
          const items = [];
          trendCats.forEach((cat) => {
            items.push({ text: cat, fillStyle: getCatColor(cat), strokeStyle: getCatColor(cat), lineWidth: 0, hidden: false, index: -1 });
          });
          return items;
        };
        // 点击图例不做任何操作（因为是纯展示标签列表）
        legendConfig.onClick = function(e, legendItem, legend) {};
      }

      trendChart = new Chart(trendCtx, {
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: legendConfig
          },
          scales: {
            x: { stacked: false, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
            y: { stacked: false, beginAtZero: true, ticks: { callback: v => v + 'm', font: { size: 10 } } }
          }
        }
      });
    }

    function saveActivity() {
      const title = document.getElementById('actTitle').value.trim();
      const start = document.getElementById('actStart').value;
      const end = document.getElementById('actEnd').value;
      const note = document.getElementById('actNote').value.trim();

      if (!title) { toast('请输入做了什么'); return; }
      if (!start || !end) { toast('请选择时间段'); return; }
      if (start >= end) { toast('结束时间需晚于开始'); return; }

      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const duration = (eh * 60 + em) - (sh * 60 + sm);
      const newStart = sh * 60 + sm;
      const newEnd = eh * 60 + em;
      const dateStr = fmtDate(currentDate);

      // Check overlap with existing activities
      const existingActs = DB.getActivitiesByDate(dateStr);
      for (const a of existingActs) {
        const [ash, asm] = a.startTime.split(':').map(Number);
        const [aeh, aem] = a.endTime.split(':').map(Number);
        const aStart = ash * 60 + asm;
        const aEnd = aeh * 60 + aem;
        if (newStart < aEnd && newEnd > aStart) {
          toast('该时间段与已记录的事件重叠');
          return;
        }
      }

      // Check overlap with running timer
      if (DB.timer) {
        const timerDate = new Date(DB.timer.startTime);
        const timerDateStr = fmtDate(timerDate);
        const tStartMin = timerDate.getHours() * 60 + timerDate.getMinutes();
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        if (timerDateStr === dateStr && newStart < nowMin && newEnd > tStartMin) {
          toast('该时间段与正在计时的事件重叠');
          return;
        }
      }

      DB.addActivity({
        date: dateStr,
        startTime: start, endTime: end, duration,
        title, category: selectedCategory, note
      });

      sheetTimerBackup = null;
      closeSheet();
      toast('已保存记录');
      renderAll();
    }

      document.getElementById('syncBtn').addEventListener('click', async () => {
        if (!Sync.ready) { toast('同步服务未就绪'); return; }
        toast('正在同步…');
        const changed = await Sync.pull();
        await Sync.push();
        if (changed) renderAll();
        toast('同步完成');
      });

      document.getElementById('actTitle').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); saveActivity(); }
      });

      // ---- Pomodoro Timer ----
      let pomoTotalSec = 25 * 60;
      let pomoRemainSec = pomoTotalSec;
      let pomoInterval = null;
      let pomoRunning = false;
      let pomoHovering = false;

      const pomoIcon = document.getElementById('pomoIcon');
      const pomoTimeText = document.getElementById('pomoTimeText');
      const pomoSheet = document.getElementById('pomoSheet');
      const pomoOverlay = document.getElementById('pomoOverlay');
      const pomoDisplay = document.getElementById('pomoDisplay');
      const pomoStartBtn = document.getElementById('pomoStartBtn');
      const pomoResetBtn = document.getElementById('pomoResetBtn');
      const pomoCustomMin = document.getElementById('pomoCustomMin');

      function pomoIsCounting() {
        return pomoRunning || (pomoRemainSec > 0 && pomoRemainSec < pomoTotalSec);
      }

      function pomoUpdateVisibility() {
        const shouldShow = pomoHovering || pomoIsCounting() || pomoIcon.classList.contains('flash');
        pomoIcon.classList.toggle('show', shouldShow);
      }

      // 鼠标悬停在番茄钟图标上时显示
      pomoIcon.addEventListener('mouseenter', () => {
        pomoHovering = true;
        pomoUpdateVisibility();
      });
      pomoIcon.addEventListener('mouseleave', () => {
        pomoHovering = false;
        pomoUpdateVisibility();
      });

      function pomoFmt(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }

      function pomoUpdateDisplay() {
        pomoDisplay.textContent = pomoFmt(pomoRemainSec);
        if (pomoRemainSec > 0 && (pomoRunning || pomoRemainSec < pomoTotalSec)) {
          pomoTimeText.textContent = pomoFmt(pomoRemainSec);
          pomoTimeText.style.display = 'block';
        } else {
          pomoTimeText.style.display = 'none';
        }
        pomoUpdateVisibility();
      }

      function pomoPlayBeep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const playTone = (freq, start, dur) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.frequency.value = freq;
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(ctx.destination);
            gain.gain.setValueAtTime(0.3, ctx.currentTime + start);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
            osc.start(ctx.currentTime + start);
            osc.stop(ctx.currentTime + start + dur);
          };
          playTone(880, 0, 0.3);
          playTone(660, 0.35, 0.3);
          playTone(880, 0.7, 0.4);
        } catch(e) {}
      }

      function pomoTick() {
        pomoRemainSec--;
        if (pomoRemainSec <= 0) {
          pomoRemainSec = 0;
          pomoRunning = false;
          clearInterval(pomoInterval);
          pomoInterval = null;
          pomoIcon.classList.add('flash');
          pomoPlayBeep();
          pomoStartBtn.textContent = '开始';
          pomoUpdateDisplay();
          setTimeout(() => pomoIcon.classList.remove('flash'), 8000);
          return;
        }
        pomoUpdateDisplay();
      }

      function pomoStart() {
        if (pomoRemainSec <= 0) pomoRemainSec = pomoTotalSec;
        pomoRunning = true;
        pomoIcon.classList.remove('flash');
        pomoStartBtn.textContent = '暂停';
        pomoInterval = setInterval(pomoTick, 1000);
        pomoUpdateDisplay();
      }

      function pomoPause() {
        pomoRunning = false;
        clearInterval(pomoInterval);
        pomoInterval = null;
        pomoStartBtn.textContent = '继续';
        pomoUpdateDisplay();
      }

      function pomoReset() {
        pomoRunning = false;
        clearInterval(pomoInterval);
        pomoInterval = null;
        pomoRemainSec = 0;
        pomoIcon.classList.remove('flash');
        pomoStartBtn.textContent = '开始';
        pomoUpdateDisplay();
      }

      let pomoDblClickTimer = null;
      pomoIcon.addEventListener('click', () => {
        if (pomoDblClickTimer) {
          clearTimeout(pomoDblClickTimer);
          pomoDblClickTimer = null;
          pomoReset();
        } else {
          pomoDblClickTimer = setTimeout(() => {
            pomoDblClickTimer = null;
            pomoSheet.classList.add('show');
            pomoOverlay.classList.add('show');
          }, 280);
        }
      });

      pomoOverlay.addEventListener('click', () => {
        pomoSheet.classList.remove('show');
        pomoOverlay.classList.remove('show');
      });

      pomoStartBtn.addEventListener('click', () => {
        if (pomoRunning) pomoPause();
        else pomoStart();
      });

      pomoResetBtn.addEventListener('click', pomoReset);

      document.querySelectorAll('.pomo-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.pomo-preset').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const min = parseInt(btn.dataset.min);
          pomoCustomMin.value = min;
          pomoTotalSec = min * 60;
          pomoRunning = false;
          clearInterval(pomoInterval);
          pomoInterval = null;
          pomoRemainSec = pomoTotalSec;
          pomoIcon.classList.remove('flash');
          pomoStartBtn.textContent = '开始';
          pomoUpdateDisplay();
        });
      });

      pomoCustomMin.addEventListener('input', () => {
        let min = parseInt(pomoCustomMin.value) || 1;
        if (min < 1) min = 1;
        if (min > 120) min = 120;
        pomoTotalSec = min * 60;
        if (!pomoRunning) {
          pomoRemainSec = pomoTotalSec;
          pomoUpdateDisplay();
        }
      });

      pomoUpdateDisplay();
      pomoUpdateVisibility();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }

    // ============ Boot ============
    DB.load();
    Sync.init();

    // 单窗口控制：已有窗口收到新窗口通知后，主动请求SW聚焦自己（可恢复最小化）
    (function() {
      const channel = new BroadcastChannel('time-tracker-single-instance');
      let isMain = true;
      let closed = false;

      // 已有窗口请求 SW 聚焦自己（能恢复最小化状态）
      function requestFocusMe() {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'focus-me' });
        } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(reg => {
            if (reg.active) reg.active.postMessage({ type: 'focus-me' });
          });
        }
        // 兜底：同时也调用 window.focus()
        window.focus();
      }

      // 监听 SW 消息：新窗口被告知关闭
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'close-yourself') {
            isMain = false;
            closed = true;
            window.close();
            setTimeout(() => {
              document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-size:14px;color:#666;">应用已在另一个窗口中打开，请切换到已有窗口。</div>';
            }, 100);
          }
        });
      }

      // 发送 ping，告诉其他窗口"我来了"
      channel.postMessage({ type: 'ping' });
      let gotPong = false;

      channel.onmessage = function(e) {
        if (e.data.type === 'ping') {
          // 已有窗口收到ping：我是主窗口，请求聚焦自己，并通知对方关闭
          if (isMain) {
            requestFocusMe();
            channel.postMessage({ type: 'pong' });
          }
        } else if (e.data.type === 'pong') {
          // 新窗口收到pong：说明已有实例，等待SW通知自己关闭
          if (!gotPong) {
            gotPong = true;
            // 兜底：2秒后如果还没收到SW回复，显示提示
            setTimeout(() => {
              if (!closed) {
                isMain = false;
                document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-size:14px;color:#666;">应用已在另一个窗口中打开，请切换到已有窗口。</div>';
              }
            }, 2000);
          }
        }
      };
    })();

    initEvents();
    renderAll();
    Sync.pull().then(changed => { if (changed) renderAll(); });
  </script>

</body></html>
