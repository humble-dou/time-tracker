      const tlAddBtn = document.getElementById('tlAddBtn');
      if (tlAddBtn) {
        tlAddBtn.addEventListener('click', () => {

        });

    // ============ Render: Day Plan ============
    function renderDayPlan(dateStr) {
      const plans = DB.getPlansByDate(dateStr);
      const el = document.getElementById('dayPlan');
      const doneCount = plans.filter(p => p.done).length;
      el.innerHTML = `
        <div class="card plan-card${planCollapsed ? ' collapsed' : ''}">
          <div class="plan-title-row">
            <div class="card-title">今天想做点什么呢${plans.length ? ' · ' + doneCount + '/' + plans.length : ''}</div>
            <button class="plan-collapse-btn${planCollapsed ? ' collapsed' : ''}" id="planCollapseBtn"></button>
          </div>
          <div class="plan-hint">写下今天的计划和安排，做完后可以勾选</div>
          <div class="plan-list" id="planList">
            ${plans.map(p => `
              <div class="plan-item${p.done ? ' done' : ''}" data-id="${p.id}">
                <div class="plan-check${p.done ? ' done' : ''}" data-id="${p.id}">✓</div>
                <div class="plan-text">${p.text}</div>
                <button class="plan-del" data-id="${p.id}">×</button>
              </div>
            `).join('')}
          </div>
          <div class="plan-add-row">
            <input type="text" class="plan-add-input" id="planAddInput" placeholder="添加一条计划..." maxlength="100">
          </div>
        </div>
      `;

      document.getElementById('planCollapseBtn').addEventListener('click', () => {
        planCollapsed = !planCollapsed;
        renderDayPlan(dateStr);
      });

      el.querySelectorAll('.plan-check').forEach(c => {
        c.addEventListener('click', () => {
          DB.togglePlan(c.dataset.id);
          renderDayPlan(dateStr);
        });
      });

      el.querySelectorAll('.plan-del').forEach(b => {
        b.addEventListener('click', e => {
          e.stopPropagation();
          DB.deletePlan(b.dataset.id);
          renderDayPlan(dateStr);
        });
      });

      // Double-click plan text to edit
      el.querySelectorAll('.plan-text').forEach(txt => {
        txt.addEventListener('dblclick', e => {
          e.stopPropagation();
          const id = txt.parentElement.dataset.id;
          const oldText = txt.textContent;
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'plan-edit-input';
          input.value = oldText;
          input.maxLength = 100;
          txt.replaceWith(input);
          input.focus();
          input.select();
          const save = () => {
            const newText = input.value.trim();
            if (newText && newText !== oldText) {
              DB.updatePlan(id, newText);
            }
            renderDayPlan(dateStr);
          };
          input.addEventListener('blur', save);
          input.addEventListener('keydown', ev => {
            if (ev.key === 'Enter') { ev.preventDefault(); save(); }
            if (ev.key === 'Escape') { renderDayPlan(dateStr); }
          });
        });
      });

      // Drag-to-reorder for plan items
      let dragSrcId = null;
      el.querySelectorAll('.plan-item').forEach(item => {
        item.setAttribute('draggable', 'true');
        item.addEventListener('dragstart', e => {
          dragSrcId = item.dataset.id;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          el.querySelectorAll('.plan-item').forEach(x => x.classList.remove('drag-over'));
        });
        item.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (item.dataset.id !== dragSrcId) item.classList.add('drag-over');
        });
        item.addEventListener('dragleave', () => {
          item.classList.remove('drag-over');
        });
        item.addEventListener('drop', e => {
          e.preventDefault();
          item.classList.remove('drag-over');
          if (!dragSrcId || dragSrcId === item.dataset.id) return;
          const list = el.querySelectorAll('.plan-item');
          const ids = Array.from(list).map(x => x.dataset.id);
          const fromIdx = ids.indexOf(dragSrcId);
          const toIdx = ids.indexOf(item.dataset.id);
          if (fromIdx < 0 || toIdx < 0) return;
          ids.splice(fromIdx, 1);
          ids.splice(toIdx, 0, dragSrcId);
          DB.reorderPlans(dateStr, ids);
          renderDayPlan(dateStr);
        });
      });

      const input = document.getElementById('planAddInput');
      const addPlan = () => {
        const text = input.value.trim();
        if (!text) return;
        DB.addPlan(dateStr, text);
        renderDayPlan(dateStr);
        setTimeout(() => document.getElementById('planAddInput')?.focus(), 50);
      };

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addPlan(); }
      });
    }

    // ============ Render: Month Page ============
    function renderMonth() {
      const d = new Date(currentDate);
      const year = d.getFullYear();
      const month = d.getMonth();
      document.getElementById('monthTitle').textContent = `${year}年${month+1}月`;

      const monthStart = `${year}-${String(month+1).padStart(2,'0')}-01`;
      const lastDay = new Date(year, month + 1, 0);
      const monthEnd = fmtDate(lastDay);
      const monthActs = DB.getActivitiesByDateRange(monthStart, monthEnd);
      const totalMin = monthActs.reduce((s,a) => s + a.duration, 0);

      const deco = document.getElementById('monthDeco');
      deco.innerHTML = `
        <div class="deco-title">${year}年${month+1}月</div>
        <div class="deco-sub">${monthActs.length}条记录 · ${fmtDuration(totalMin)}</div>
        <div class="deco-bubble" style="width:50px;height:50px;right:20px;top:-12px"></div>
        <div class="deco-bubble" style="width:24px;height:24px;right:60px;bottom:-8px"></div>
        <div class="deco-leaf" style="left:-8px;bottom:-8px;transform:rotate(15deg);width:30px;height:30px"></div>
      `;

      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();
      const totalDays = lastDay.getDate();
      const todayStr = fmtDate(new Date());
      const grid = document.getElementById('monthGrid');

      let cells = [];
      cells.push('<div class="mg-dot-cell"></div>');
      ['日','一','二','三','四','五','六'].forEach(w => cells.push(`<div class="mg-header">${w}</div>`));

      let firstDotDate = new Date(year, month, 1);
      if (startWeekday === 0) firstDotDate = new Date(year, month, 2);
      cells.push(`<div class="mg-dot-cell"><button class="mg-dot-btn" data-week="${fmtDate(firstDotDate)}"></button></div>`);
      for (let i = 0; i < startWeekday; i++) cells.push(`<div class="month-cell empty"></div>`);
      for (let day = 1; day <= totalDays; day++) {
        const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const acts = DB.getActivitiesByDate(ds);
        const isToday = ds === todayStr;
        const showActs = acts.slice(0, 3);
        const extra = acts.length - showActs.length;
        cells.push(`
          <div class="month-cell${isToday ? ' today' : ''}${acts.length > 0 ? ' has-events' : ''}" data-date="${ds}">
            <div class="mc-date">${day}</div>
            <div class="mc-events">
              ${showActs.map(a => `<div class="mc-event" style="background:${catRgba(getPrimaryCat(a),0.15)};color:${getCatColor(getPrimaryCat(a))}">${a.title}</div>`).join('')}
              ${extra > 0 ? `<div class="mc-more">+${extra}</div>` : ''}
              ${acts.length === 0 ? '<div class="mc-empty"></div>' : ''}
            </div>
          </div>
        `);
        if (new Date(year, month, day).getDay() === 6 && day < totalDays) {
          let nextDotDate = new Date(year, month, day + 2);
          if (day + 2 > totalDays) nextDotDate = new Date(year, month, day + 1);
          cells.push(`<div class="mg-dot-cell"><button class="mg-dot-btn" data-week="${fmtDate(nextDotDate)}"></button></div>`);
        }
      }
      const trailingCells = (7 - ((startWeekday + totalDays) % 7) || 7) % 7;
      for (let i = 0; i < trailingCells; i++) cells.push('<div class="month-cell empty"></div>');

      grid.innerHTML = cells.join('');
      grid.querySelectorAll('.month-cell[data-date]').forEach(el => {
        el.addEventListener('click', () => {
          currentDate = new Date(el.dataset.date);
          switchPage('Day');
        });
      });
      grid.querySelectorAll('.mg-dot-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          currentDate = new Date(btn.dataset.week);
          switchPage('Week');
        });
      });

      document.getElementById('monthStats').innerHTML = '';
    }

    // ============ Render: Stats Page ============
    let trendChart = null;
    let barPeriod = 'month'; // day | week | month
    let trendPeriod = 'month'; // week | month
    let trendCats = []; // array of selected category names
    let customDateRange = null; // { start: 'YYYY-MM-DD', end: 'YYYY-MM-DD' } when active

    function getStatsDateRange(period) {
      const now = new Date();
      let start, end;
      if (period === 'day') {
        start = new Date(now); end = new Date(now);
      } else if (period === 'week') {
        start = new Date(now); start.setDate(now.getDate() - 6); end = new Date(now);
      } else { // month
        start = new Date(now.getFullYear(), now.getMonth(), 1);
        end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
      }
      return { start: fmtDate(start), end: fmtDate(end), startDate: start, endDate: end };
    }

    function getBarPeriodLabel() {
      return { day: '日维度', week: '周维度', month: '月维度' }[barPeriod];
    }
    function getTrendPeriodLabel() {
      return { week: '周维度', month: '月维度' }[trendPeriod];
    }

    function setupDropdown(btnId, dropdownId, onSelect, multiSelect, maxSelect) {
      const btn = document.getElementById(btnId);
      const dropdown = document.getElementById(dropdownId);
      if (!btn || !dropdown) return;

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== dropdownId) d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          const val = opt.dataset.val;
          onSelect(val, opt);
        };
      });
    }

    function closeAllDropdowns() {
      document.querySelectorAll('.stats-filter-dropdown').forEach(d => d.classList.remove('show'));
    }
    document.addEventListener('click', closeAllDropdowns);

    function renderBarPeriodDropdown() {
      const btn = document.getElementById('barPeriodBtn');
      const dropdown = document.getElementById('barPeriodDropdown');
      const options = [
        { val: 'day', label: '日维度' },
        { val: 'week', label: '周维度' },
        { val: 'month', label: '月维度' }
      ];
      dropdown.innerHTML = options.map(o =>
        `<div class="stats-filter-option${barPeriod === o.val ? ' selected' : ''}" data-val="${o.val}">${o.label}</div>`
      ).join('');

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'barPeriodDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          barPeriod = opt.dataset.val;
          customDateRange = null;
          document.getElementById('barPeriodBtn').textContent = getBarPeriodLabel();
          document.getElementById('customDateBtn').textContent = '自定义';
          renderBars();
          closeAllDropdowns();
          renderBarPeriodDropdown();
        };
      });
    }

    function renderTrendPeriodDropdown() {
      const btn = document.getElementById('trendPeriodBtn');
      const dropdown = document.getElementById('trendPeriodDropdown');
      const options = [
        { val: 'week', label: '周维度' },
        { val: 'month', label: '月维度' }
      ];
      dropdown.innerHTML = options.map(o =>
        `<div class="stats-filter-option${trendPeriod === o.val ? ' selected' : ''}" data-val="${o.val}">${o.label}</div>`
      ).join('');

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'trendPeriodDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          trendPeriod = opt.dataset.val;
          document.getElementById('trendPeriodBtn').textContent = getTrendPeriodLabel();
          renderTrendCatDropdown();
          renderTrendChart();
          closeAllDropdowns();
          renderTrendPeriodDropdown();
        };
      });
    }

    function renderTrendCatDropdown() {
      const btn = document.getElementById('trendCatBtn');
      const dropdown = document.getElementById('trendCatDropdown');
      const allCats = DB.getAllCats();
      const selectedCount = trendCats.length;
      const allSelected = selectedCount === allCats.length;
      const noneSelected = selectedCount === 0;

      let html = `<div class="stats-filter-option${allSelected ? ' selected' : ''}" data-val="all">
        <span class="check">${allSelected ? '✓' : ''}</span>全部
      </div>`;
      allCats.forEach(cat => {
        const selected = trendCats.includes(cat);
        html += `<div class="stats-filter-option${selected ? ' selected' : ''}" data-val="${cat}">
          <span class="check">${selected ? '✓' : ''}</span>${cat}
        </div>`;
      });
      dropdown.innerHTML = html;

      btn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.stats-filter-dropdown').forEach(d => {
          if (d.id !== 'trendCatDropdown') d.classList.remove('show');
        });
        dropdown.classList.toggle('show');
      };

      dropdown.querySelectorAll('.stats-filter-option').forEach(opt => {
        opt.onclick = (e) => {
          e.stopPropagation();
          const val = opt.dataset.val;
          if (val === 'all') {
            if (allSelected) {
              // 点击全选且当前全选中 -> 取消全选（默认选中第一个，避免空）
              trendCats = allCats.length > 0 ? [allCats[0]] : [];
            } else {
              // 点击全选但未全选 -> 全选
              trendCats = [...allCats];
            }
          } else {
            if (trendCats.includes(val)) {
              trendCats = trendCats.filter(c => c !== val);
              // 至少保留一个
              if (trendCats.length === 0) trendCats = [...allCats];
            } else {
              trendCats.push(val);
            }
          }
          // 更新按钮文字
          if (trendCats.length === allCats.length) btn.textContent = '全部';
          else if (trendCats.length === 1) btn.textContent = trendCats[0];
          else btn.textContent = `已选${trendCats.length}个`;
          renderTrendCatDropdown();
          renderTrendChart();
        };
      });
    }

    function renderStats() {
      const allCats = DB.getAllCats();
      // 初始化为全选
      if (trendCats.length === 0) trendCats = [...allCats];
      renderBarPeriodDropdown();
      renderTrendPeriodDropdown();
      renderTrendCatDropdown();
      document.getElementById('barPeriodBtn').textContent = getBarPeriodLabel();
      document.getElementById('trendPeriodBtn').textContent = getTrendPeriodLabel();
      const btn = document.getElementById('trendCatBtn');
      if (trendCats.length === allCats.length) btn.textContent = '全部';
      else if (trendCats.length === 1) btn.textContent = trendCats[0];
      else btn.textContent = `已选${trendCats.length}个`;
      setupCustomDatePicker();
      renderBars();
      renderTrendChart();
    }

    function setupCustomDatePicker() {
      const overlay = document.getElementById('customDateOverlay');
      const btn = document.getElementById('customDateBtn');
      const startInput = document.getElementById('customDateStart');
      const endInput = document.getElementById('customDateEnd');
      const confirmBtn = document.getElementById('customDateConfirm');
      const cancelBtn = document.getElementById('customDateCancel');

      btn.onclick = (e) => {
        e.stopPropagation();
        const today = fmtDate(new Date());
        startInput.value = customDateRange ? customDateRange.start : today;
        endInput.value = customDateRange ? customDateRange.end : today;
        overlay.classList.add('show');
      };

      cancelBtn.onclick = () => { overlay.classList.remove('show'); };
      overlay.onclick = (e) => { if (e.target === overlay) overlay.classList.remove('show'); };

      confirmBtn.onclick = () => {
        const start = startInput.value;
        const end = endInput.value;
        if (!start || !end) { toast('请选择起始和结束日期'); return; }
        if (start > end) { toast('结束日期需晚于或等于起始日期'); return; }
        customDateRange = { start, end };
        btn.textContent = `${start}~${end}`;
        overlay.classList.remove('show');
        renderBars();
      };
    }

    function renderBars() {
      let range, rangeLabel;
      if (customDateRange) {
        range = { start: customDateRange.start, end: customDateRange.end };
        rangeLabel = `${customDateRange.start} ~ ${customDateRange.end}`;
      } else {
        range = getStatsDateRange(barPeriod);
        rangeLabel = { day: '今日', week: '近7天', month: '本月' }[barPeriod];
      }
      const acts = DB.getActivitiesByDateRange(range.start, range.end);

      const catMinutes = {};
      acts.forEach(a => {
        const cat = getPrimaryCat(a);
        catMinutes[cat] = (catMinutes[cat] || 0) + a.duration;
      });
      const totalMin = Object.values(catMinutes).reduce((s,v) => s + v, 0);

      const deco = document.getElementById('statsDeco');
      deco.innerHTML = `
        <div class="deco-title">数据统计</div>
        <div class="deco-sub">${rangeLabel} · ${acts.length}条记录 · ${fmtDuration(totalMin)}</div>
        <div class="deco-bubble" style="width:55px;height:55px;right:-10px;top:-10px"></div>
        <div class="deco-bubble" style="width:25px;height:25px;right:40px;bottom:-8px"></div>
      `;

      document.getElementById('statsTotalHours').textContent = fmtDuration(totalMin);

      const bars = document.getElementById('statsBars');
      const sortedCats = Object.entries(catMinutes).sort((a,b) => b[1] - a[1]);
      if (sortedCats.length === 0) {
        bars.innerHTML = '<div class="empty"><div class="empty-text">暂无数据</div></div>';
      } else {
        bars.innerHTML = sortedCats.map(([cat, min]) => {
          const pct = totalMin > 0 ? (min / totalMin * 100) : 0;
          const durText = fmtDuration(min);
          const catColor = getCatColor(cat);
          return `
            <div class="stats-bar-row">
              <div class="stats-bar-label">${cat}</div>
              <div class="stats-bar-track">
                <div class="stats-bar-colored" style="width:${pct}%;background:${catColor}"></div>
                <span class="stats-bar-text" style="left:calc(${pct}% + 6px);color:${catColor}">${durText}</span>
              </div>
            </div>`;
        }).join('');
      }

      document.getElementById('statsLegend').innerHTML =
        Object.keys(catMinutes).sort((a,b) => catMinutes[b] - catMinutes[a]).map(cat =>
          `<div class="stats-legend-item"><div class="stats-legend-dot" style="background:${getCatColor(cat)}"></div>${cat}</div>`
        ).join('');
    }

    function renderTrendChart() {
      const range = getStatsDateRange(trendPeriod);
      const acts = DB.getActivitiesByDateRange(range.start, range.end);
      const trendEl = document.getElementById('statsTrend');
      const allCats = DB.getAllCats();
      const isAllSelected = trendCats.length === allCats.length;

      let labels = [];
      let totalData = [];

      if (trendPeriod === 'week') {
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const ds = fmtDate(d);
          const dayActs = acts.filter(a => a.date === ds && trendCats.includes(getPrimaryCat(a)));
          const min = dayActs.reduce((s,a) => s + a.duration, 0);
          labels.push(`${d.getMonth()+1}/${d.getDate()}`);
          totalData.push(min);
        }
      } else { // month
        const now = new Date();
        const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        for (let i = 1; i <= daysInMonth; i++) {
          const ds = fmtDate(new Date(now.getFullYear(), now.getMonth(), i));
          const dayActs = acts.filter(a => a.date === ds && trendCats.includes(getPrimaryCat(a)));
          const min = dayActs.reduce((s,a) => s + a.duration, 0);
          labels.push(`${i}日`);
          totalData.push(min);
        }
      }

      let datasets = [];

      if (isAllSelected || trendCats.length <= 1) {
        // 全选或单选时，显示柱状图 + 折线图（汇总）
        const barColor = isAllSelected ? '#c97890' : (trendCats.length === 1 ? getCatColor(trendCats[0]) : '#c97890');
        const lineColor = '#8ec1e0';
        datasets.push({
          type: 'bar',
          label: '时长',
          data: totalData,
          backgroundColor: barColor,
          borderRadius: 6,
          barPercentage: 0.6,
          yAxisID: 'y'
        });
        datasets.push({
          type: 'line',
          label: '趋势',
          data: totalData,
          borderColor: lineColor,
          backgroundColor: lineColor + '20',
          borderWidth: 2,
          pointRadius: 2,
          pointBackgroundColor: lineColor,
          pointBorderColor: lineColor,
          pointBorderWidth: 2,
          tension: 0.3,
          fill: true,
          yAxisID: 'y'
        });
      } else if (trendCats.length > 3) {
        // 选了超过3个标签：汇总成一根柱状图 + 一根折线图，图例展示所有选中标签名
        const lineColor = '#8ec1e0';
        datasets.push({
          type: 'bar',
          label: '汇总时长',
          data: totalData,
          backgroundColor: '#c97890',
          borderRadius: 6,
          barPercentage: 0.6,
          yAxisID: 'y'
        });
        datasets.push({
          type: 'line',
          label: '汇总趋势',
          data: totalData,
          borderColor: lineColor,
          backgroundColor: lineColor + '20',
          borderWidth: 2,
          pointRadius: 2,
          pointBackgroundColor: lineColor,
          pointBorderColor: lineColor,
          pointBorderWidth: 2,
          tension: 0.3,
          fill: true,
          yAxisID: 'y'
        });
      } else {
        // 多选2-3个标签时：每个分类一组柱状图 + 各自的折线图
        const barDatasets = [];
        const lineDatasets = [];
        trendCats.forEach(cat => {
          const catData = [];
          if (trendPeriod === 'week') {
            for (let i = 6; i >= 0; i--) {
              const d = new Date();
              d.setDate(d.getDate() - i);
              const ds = fmtDate(d);
              const min = acts.filter(a => a.date === ds && getPrimaryCat(a) === cat).reduce((s,a) => s + a.duration, 0);
              catData.push(min);
            }
          } else {
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            for (let i = 1; i <= daysInMonth; i++) {
              const ds = fmtDate(new Date(now.getFullYear(), now.getMonth(), i));
              const min = acts.filter(a => a.date === ds && getPrimaryCat(a) === cat).reduce((s,a) => s + a.duration, 0);
              catData.push(min);
            }
          }
          const catColor = getCatColor(cat);
          const lightColor = lightenColor(catColor, 0.5);
          barDatasets.push({
            type: 'bar',
            label: cat,
            data: catData,
            backgroundColor: catColor,
            borderRadius: 4,
            barPercentage: 0.7,
            yAxisID: 'y'
          });
          lineDatasets.push({
            type: 'line',
            label: cat + '趋势',
            data: catData,
            borderColor: lightColor,
            borderWidth: 2,
            pointRadius: 2,
            pointBackgroundColor: lightColor,
            pointBorderColor: lightColor,
            pointBorderWidth: 2,
            tension: 0.3,
            fill: false,
            yAxisID: 'y'
          });
        });
        datasets = datasets.concat(barDatasets).concat(lineDatasets);
      }

      if (trendChart) trendChart.destroy();
      trendEl.innerHTML = '';
      const trendCtx = document.createElement('canvas');
      trendCtx.height = 200;
      trendEl.appendChild(trendCtx);

      // 自定义图例配置
      const legendConfig = { display: true, position: 'bottom', labels: { font: { size: 10 }, boxWidth: 12, boxHeight: 12, usePointStyle: false } };
      // 超过3个标签时，图例只展示所有选中的标签名（纯展示，不对应具体dataset）
      if (trendCats.length > 3 && !isAllSelected) {
        legendConfig.labels.generateLabels = function(chart) {
          const items = [];
          trendCats.forEach((cat) => {
            items.push({ text: cat, fillStyle: getCatColor(cat), strokeStyle: getCatColor(cat), lineWidth: 0, hidden: false, index: -1 });
          });
          return items;
        };
        // 点击图例不做任何操作（因为是纯展示标签列表）
        legendConfig.onClick = function(e, legendItem, legend) {};
      }

      trendChart = new Chart(trendCtx, {
        data: {
          labels: labels,
          datasets: datasets
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: legendConfig
          },
          scales: {
            x: { stacked: false, ticks: { font: { size: 10 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
            y: { stacked: false, beginAtZero: true, ticks: { callback: v => v + 'm', font: { size: 10 } } }
          }
        }
      });
    }

    function renderSelectedCatsBar() {
      const bar = document.getElementById('selectedCatsBar');
      if (!bar) return;
      if (selectedCategories.length === 0) {
        bar.innerHTML = '<span style="font-size:11px;color:var(--muted);">请选择分类</span>';
        return;
      }
      bar.innerHTML = selectedCategories.map((cat, idx) => `
        <span class="selected-cat-chip${idx === 0 ? ' is-primary' : ''}"
              data-cat="${cat}" draggable="true"
              style="background:${catRgba(cat, 0.18)};color:${getCatColor(cat)};">
          ${idx === 0 ? '★ ' : ''}${cat}
          <button class="chip-remove" data-remove="${cat}" title="移除">×</button>
        </span>
      `).join('');

      // 移除
      bar.querySelectorAll('.chip-remove').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const cat = btn.dataset.remove;
          selectedCategories = selectedCategories.filter(c => c !== cat);
          renderSelectedCatsBar();
          renderCatGrid();
        });
      });

      // 拖动排序
      let dragCat = null;
      bar.querySelectorAll('.selected-cat-chip').forEach(chip => {
        chip.addEventListener('dragstart', e => {
          dragCat = chip.dataset.cat;
          chip.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        chip.addEventListener('dragend', () => {
          chip.classList.remove('dragging');
        });
        chip.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        chip.addEventListener('drop', e => {
          e.preventDefault();
          if (!dragCat || dragCat === chip.dataset.cat) return;
          const fromIdx = selectedCategories.indexOf(dragCat);
          const toIdx = selectedCategories.indexOf(chip.dataset.cat);
          selectedCategories.splice(fromIdx, 1);
          selectedCategories.splice(toIdx, 0, dragCat);
          renderSelectedCatsBar();
        });
      });
    }

    function renderCatGrid() {
      const grid = document.getElementById('catGrid');

      grid.innerHTML = cats.map(cat =>
        `<button type="button" class="cat-btn${selectedCategories.includes(cat) ? ' selected' : ''}" data-cat="${cat}" draggable="true">${cat}<span class="cat-del" data-del="${cat}">×</span></button>`

      grid.querySelectorAll('.cat-btn[data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cat = btn.dataset.cat;
          if (selectedCategories.includes(cat)) {
            // 取消选中
            selectedCategories = selectedCategories.filter(c => c !== cat);
            btn.classList.remove('selected');
          } else {
            // 添加到末尾
            selectedCategories.push(cat);
            btn.classList.add('selected');
          }
          renderSelectedCatsBar();

      });

      // 分类网格拖动排序
      let dragCat = null;
      grid.querySelectorAll('.cat-btn[data-cat]').forEach(btn => {
        btn.addEventListener('dragstart', e => {
          dragCat = btn.dataset.cat;
          btn.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        btn.addEventListener('dragend', () => {
          btn.classList.remove('dragging');
          dragCat = null;
        });
        btn.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });
        btn.addEventListener('drop', e => {
          e.preventDefault();
          if (!dragCat || dragCat === btn.dataset.cat) return;
          const allCats = DB.getAllCats();
          const fromIdx = allCats.indexOf(dragCat);

          renderCatGrid();

        const addBtn = document.getElementById('catAddBtn');
        addBtn.outerHTML = `<div style="grid-column: 1 / -1; display:flex; gap:8px; align-items:center;"><input type="text" id="catAddInput" placeholder="输入新分类名称" style="flex:1; border:1.5px solid var(--accent); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; background:var(--bg);"><button type="button" id="catAddConfirm" style="border:none; border-radius:var(--radius-sm); padding:8px 14px; font-size:13px; font-weight:700; background:var(--accent); color:#fff;">添加</button><button type="button" id="catAddCancel" style="border:1.5px solid var(--rule); border-radius:var(--radius-sm); padding:8px 12px; font-size:13px; background:var(--bg); color:var(--muted);">取消</button></div>`;
        const input = document.getElementById('catAddInput');

    function saveActivity() {
      const start = document.getElementById('actStart').value;
      const end = document.getElementById('actEnd').value;
      const note = document.getElementById('actNote').value.trim();

      if (selectedCategories.length === 0) { toast('请至少选择一个分类'); return; }
      if (!start || !end) { toast('请选择时间段'); return; }
      if (start >= end) { toast('结束时间需晚于开始'); return; }

      const [sh, sm] = start.split(':').map(Number);
      const [eh, em] = end.split(':').map(Number);
      const duration = (eh * 60 + em) - (sh * 60 + sm);
      const newStart = sh * 60 + sm;
      const newEnd = eh * 60 + em;
      const dateStr = fmtDate(currentDate);

      // Check overlap with existing activities (skip current editing record)
      const existingActs = DB.getActivitiesByDate(dateStr).filter(a => a.id !== editingActivityId);
      for (const a of existingActs) {
        const [ash, asm] = a.startTime.split(':').map(Number);
        const [aeh, aem] = a.endTime.split(':').map(Number);
        const aStart = ash * 60 + asm;
        const aEnd = aeh * 60 + aem;
        if (newStart < aEnd && newEnd > aStart) {
          toast('该时间段与已记录的事件重叠');
          return;
        }
      }

      // Check overlap with running timer
      if (DB.timerActive()) {
        const timerDate = new Date(DB.timer.startTime);
        const timerDateStr = fmtDate(timerDate);
        const tStartMin = timerDate.getHours() * 60 + timerDate.getMinutes();
        const now = new Date();
        const nowMin = now.getHours() * 60 + now.getMinutes();
        if (timerDateStr === dateStr && newStart < nowMin && newEnd > tStartMin) {
          toast('该时间段与正在计时的事件重叠');
          return;
        }
      }

      // 标题使用主标签
      const title = selectedCategories[0];

      if (editingActivityId) {
        // 编辑模式：更新现有记录
        const act = DB.activities.find(a => a.id === editingActivityId);
        if (act) {
          act.startTime = start;
          act.endTime = end;
          act.duration = duration;
          act.title = title;
          act.categories = [...selectedCategories];
          act.note = note;
          act.updatedAt = Date.now();
          DB.save();
        }
      } else {
        // 新增模式
        DB.addActivity({
          date: dateStr,
          startTime: start, endTime: end, duration,
          title, categories: [...selectedCategories], note
        });
      }

      sheetTimerBackup = null;
      closeSheet();
      toast(editingActivityId ? '已更新记录' : '已保存记录');
      renderAll();
    }

        const changed = await Sync.pull();
        await Sync.push();
        if (changed) renderAll();
        toast('同步完成');
      });

      // ---- Pomodoro Timer ----
      let pomoTotalSec = 25 * 60;
      let pomoRemainSec = pomoTotalSec;
      let pomoInterval = null;
      let pomoRunning = false;
      let pomoHovering = false;

      const pomoIcon = document.getElementById('pomoIcon');
      const pomoTimeText = document.getElementById('pomoTimeText');
      const pomoSheet = document.getElementById('pomoSheet');
      const pomoOverlay = document.getElementById('pomoOverlay');
      const pomoDisplay = document.getElementById('pomoDisplay');
      const pomoStartBtn = document.getElementById('pomoStartBtn');
      const pomoResetBtn = document.getElementById('pomoResetBtn');
      const pomoCustomMin = document.getElementById('pomoCustomMin');

      function pomoIsCounting() {
        return pomoRunning || (pomoRemainSec > 0 && pomoRemainSec < pomoTotalSec);
      }

      function pomoUpdateVisibility() {
        const shouldShow = pomoHovering || pomoIsCounting() || pomoIcon.classList.contains('flash');
        pomoIcon.classList.toggle('show', shouldShow);
      }

      // 鼠标悬停在番茄钟图标上时显示
      pomoIcon.addEventListener('mouseenter', () => {
        pomoHovering = true;
        pomoUpdateVisibility();
      });
      pomoIcon.addEventListener('mouseleave', () => {
        pomoHovering = false;
        pomoUpdateVisibility();
      });

      function pomoFmt(sec) {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      }

      function pomoUpdateDisplay() {
        pomoDisplay.textContent = pomoFmt(pomoRemainSec);
        if (pomoRemainSec > 0 && (pomoRunning || pomoRemainSec < pomoTotalSec)) {
          pomoTimeText.textContent = pomoFmt(pomoRemainSec);
          pomoTimeText.style.display = 'block';
        } else {
          pomoTimeText.style.display = 'none';
        }
        pomoUpdateVisibility();
      }

      // 番茄钟结束铃声 - 清脆叮铃铃
      let pomoAlarmCtx = null;
      let pomoAlarmTimer = null;
      let pomoAlarmStopTimer = null;
      let pomoAlarmOscillators = [];

      function pomoStartAlarm() {
        // 先停掉之前的
        pomoStopAlarm();

        try {
          pomoAlarmCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) { return; }

        const playDing = (freq1, freq2, startTime, volume) => {
          // 双音叠加，模拟铃铛的泛音
          const osc1 = pomoAlarmCtx.createOscillator();
          const osc2 = pomoAlarmCtx.createOscillator();
          const gain = pomoAlarmCtx.createGain();

          osc1.type = 'sine';
          osc1.frequency.value = freq1;
          osc2.type = 'triangle';
          osc2.frequency.value = freq2;

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(pomoAlarmCtx.destination);

          const t = pomoAlarmCtx.currentTime + startTime;
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(volume, t + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2);

          osc1.start(t);
          osc2.start(t);
          osc1.stop(t + 1.2);
          osc2.stop(t + 1.2);

          pomoAlarmOscillators.push(osc1, osc2);
        };

        // 叮铃铃节奏：叮-铃-铃
        const playChime = (offset) => {
          const v = 0.28;
          playDing(1200, 1800, 0 + offset, v);      // 叮
          playDing(1500, 2200, 0.22 + offset, v);   // 铃
          playDing(1800, 2600, 0.44 + offset, v);   // 铃
        };

        // 先响一次
        playChime(0);

        // 每隔 1.8 秒重复一次
        let count = 0;
        const maxCount = 66; // 约 2 分钟（1.8 * 66 ≈ 119 秒）
        pomoAlarmTimer = setInterval(() => {
          count++;
          if (count >= maxCount) {
            // 2 分钟到了，停止铃声并自动重置
            pomoStopAlarm();
            pomoReset();
            return;
          }
          if (pomoAlarmCtx) {
            playChime(0);
          }
        }, 1800);
      }

      function pomoStopAlarm() {
        if (pomoAlarmTimer) {
          clearInterval(pomoAlarmTimer);
          pomoAlarmTimer = null;
        }
        if (pomoAlarmStopTimer) {
          clearTimeout(pomoAlarmStopTimer);
          pomoAlarmStopTimer = null;
        }
        pomoAlarmOscillators.forEach(osc => {
          try { osc.stop(); } catch(e) {}
        });
        pomoAlarmOscillators = [];
        if (pomoAlarmCtx) {
          try { pomoAlarmCtx.close(); } catch(e) {}
          pomoAlarmCtx = null;
        }
      }

      function pomoTick() {
        pomoRemainSec--;
        if (pomoRemainSec <= 0) {
          pomoRemainSec = 0;
          pomoRunning = false;
          clearInterval(pomoInterval);
          pomoInterval = null;
          pomoIcon.classList.add('flash');
          pomoStartAlarm();
          pomoStartBtn.textContent = '开始';
          pomoUpdateDisplay();
          setTimeout(() => pomoIcon.classList.remove('flash'), 8000);
          return;
        }
        pomoUpdateDisplay();
      }

      function pomoStart() {
        if (pomoRemainSec <= 0) pomoRemainSec = pomoTotalSec;
        pomoRunning = true;
        pomoIcon.classList.remove('flash');
        pomoStartBtn.textContent = '暂停';
        pomoInterval = setInterval(pomoTick, 1000);
        pomoUpdateDisplay();
      }

      function pomoPause() {
        pomoRunning = false;
        clearInterval(pomoInterval);
        pomoInterval = null;
        pomoStartBtn.textContent = '继续';
        pomoUpdateDisplay();
      }

      function pomoReset() {
        pomoRunning = false;
        clearInterval(pomoInterval);
        pomoInterval = null;
        pomoRemainSec = 0;
        pomoIcon.classList.remove('flash');
        pomoStopAlarm();
        pomoStartBtn.textContent = '开始';
        pomoUpdateDisplay();
      }

      let pomoDblClickTimer = null;
      pomoIcon.addEventListener('click', () => {
        if (pomoDblClickTimer) {
          clearTimeout(pomoDblClickTimer);
          pomoDblClickTimer = null;
          pomoReset();
        } else {
          pomoDblClickTimer = setTimeout(() => {
            pomoDblClickTimer = null;
            pomoSheet.classList.add('show');
            pomoOverlay.classList.add('show');
          }, 280);
        }
      });

      pomoOverlay.addEventListener('click', () => {
        pomoSheet.classList.remove('show');
        pomoOverlay.classList.remove('show');
      });

      pomoStartBtn.addEventListener('click', () => {
        if (pomoRunning) pomoPause();
        else pomoStart();
      });

      pomoResetBtn.addEventListener('click', pomoReset);

      document.querySelectorAll('.pomo-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.pomo-preset').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const min = parseInt(btn.dataset.min);
          pomoCustomMin.value = min;
          pomoTotalSec = min * 60;
          pomoRunning = false;
          clearInterval(pomoInterval);
          pomoInterval = null;
          pomoRemainSec = pomoTotalSec;
          pomoIcon.classList.remove('flash');
          pomoStopAlarm();
          pomoStartBtn.textContent = '开始';
          pomoUpdateDisplay();
        });
      });

      pomoCustomMin.addEventListener('input', () => {
        let min = parseInt(pomoCustomMin.value) || 1;
        if (min < 1) min = 1;
        if (min > 120) min = 120;
        pomoTotalSec = min * 60;
        pomoStopAlarm();
        if (!pomoRunning) {
          pomoRemainSec = pomoTotalSec;
          pomoUpdateDisplay();
        }
      });

      pomoUpdateDisplay();
      pomoUpdateVisibility();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }

    // 单窗口控制：已有窗口收到新窗口通知后，主动请求SW聚焦自己（可恢复最小化）
    (function() {
      const channel = new BroadcastChannel('time-tracker-single-instance');
      let isMain = true;
      let closed = false;

      // 已有窗口请求 SW 聚焦自己（能恢复最小化状态）
      function requestFocusMe() {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'focus-me' });
        } else if (navigator.serviceWorker && navigator.serviceWorker.ready) {
          navigator.serviceWorker.ready.then(reg => {
            if (reg.active) reg.active.postMessage({ type: 'focus-me' });
          });
        }
        // 兜底：同时也调用 window.focus()
        window.focus();
      }

      // 监听 SW 消息：新窗口被告知关闭
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(e) {
          if (e.data && e.data.type === 'close-yourself') {
            isMain = false;
            closed = true;
            window.close();
            setTimeout(() => {
              document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-size:14px;color:#666;">应用已在另一个窗口中打开，请切换到已有窗口。</div>';
            }, 100);
          }
        });
      }

      // 发送 ping，告诉其他窗口"我来了"
      channel.postMessage({ type: 'ping' });
      let gotPong = false;

      channel.onmessage = function(e) {
        if (e.data.type === 'ping') {
          // 已有窗口收到ping：我是主窗口，请求聚焦自己，并通知对方关闭
          if (isMain) {
            requestFocusMe();
            channel.postMessage({ type: 'pong' });
          }
        } else if (e.data.type === 'pong') {
          // 新窗口收到pong：说明已有实例，等待SW通知自己关闭
          if (!gotPong) {
            gotPong = true;
            // 兜底：2秒后如果还没收到SW回复，显示提示
            setTimeout(() => {
              if (!closed) {
                isMain = false;
                document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-size:14px;color:#666;">应用已在另一个窗口中打开，请切换到已有窗口。</div>';
              }
            }, 2000);
          }
        }
      };
    })();

    // 侧边栏拖拽调整宽度
    (function initPanelResizer() {
      const resizer = document.getElementById('panelResizer');
      const panel = document.getElementById('warehousePanel');
      if (!resizer || !panel) return;

      const MIN_WIDTH = 260;
      const MAX_WIDTH = 600;
      let isDragging = false;
      let startX = 0;
      let startWidth = 0;

      // 从 localStorage 读取保存的宽度
      const savedWidth = localStorage.getItem('warehouseWidth');
      if (savedWidth) {
        const w = parseInt(savedWidth);
        if (w >= MIN_WIDTH && w <= MAX_WIDTH) {
          document.documentElement.style.setProperty('--warehouse-width', w + 'px');
        }
      }

      // 更新右侧背景图位置，使其与内容区中心对齐
      function updateBgPosition() {
        if (!document.body.classList.contains('warehouse-open')) return;
        const panelWidth = panel.offsetWidth;
        const offset = panelWidth / 2;
        document.body.style.setProperty('--bg-offset', offset + 'px');
      }

      resizer.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        const currentWidth = panel.offsetWidth;
        startWidth = currentWidth;
        resizer.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const deltaX = e.clientX - startX;
        let newWidth = startWidth + deltaX;
        if (newWidth < MIN_WIDTH) newWidth = MIN_WIDTH;
        if (newWidth > MAX_WIDTH) newWidth = MAX_WIDTH;
        document.documentElement.style.setProperty('--warehouse-width', newWidth + 'px');
        updateBgPosition();
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        resizer.classList.remove('dragging');
        document.body.classList.remove('resizing');
        // 保存宽度到 localStorage
        const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--warehouse-width'));
        if (w) localStorage.setItem('warehouseWidth', w);
        updateBgPosition();
      });

      // 双击恢复默认宽度
      resizer.addEventListener('dblclick', () => {
        document.documentElement.style.removeProperty('--warehouse-width');
        localStorage.removeItem('warehouseWidth');
        setTimeout(updateBgPosition, 50);
      });

      // 初始化背景位置
      setTimeout(updateBgPosition, 100);
    })();

    // 切换视图
    function switchWarehouseView(view) {
      warehouseCurrentView = view;
      const panel = document.getElementById('warehousePanel');

    function fmtWarehouseDate(dateStr) {
      const d = new Date(dateStr);
      const today = new Date();
      const isToday = d.toDateString() === today.toDateString();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      if (isToday) return '今天';
      if (isYesterday) return '昨天';
      return (d.getMonth() + 1) + '月' + d.getDate() + '日';
    }

    // 复制文本到剪贴板
    function copyToClipboard(text, btnEl) {
      if (!text) {
        if (btnEl) {
          btnEl.textContent = '空';
          setTimeout(() => { btnEl.textContent = '📋'; }, 1000);
        }
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        if (btnEl) {
          btnEl.classList.add('copied');
          btnEl.textContent = '✓';
          setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.textContent = '📋';
          }, 1200);
        }
      }).catch(() => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta);
        if (btnEl) {
          btnEl.classList.add('copied');
          btnEl.textContent = '✓';
          setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.textContent = '📋';
          }, 1200);
        }
      });
    }

    // 加载三个分类的编辑区内容
    function loadWarehouseEditors() {
      const today = fmtDate(new Date());
      ['reflection', 'miao', 'thought'].forEach(type => {
        const bulletTypes = ['miao', 'thought'];
        const isBulletType = bulletTypes.includes(type);
        if (isBulletType) {
          const listEl = document.querySelector(`.warehouse-bullet-list[data-type="${type}"]`);
          if (!listEl) return;
          const content = DB.getWarehouseContent(today, type);
          renderBulletList(listEl, content);
        } else {
          const textarea = document.querySelector(`.warehouse-edit-textarea[data-type="${type}"]`);
          if (!textarea) return;
          textarea.value = DB.getWarehouseContent(today, type);
        }
      });
    }

    // 渲染圆点列表
    function renderBulletList(listEl, content) {
      const lines = content ? content.split('\n').filter(l => l.trim()) : [];
      listEl.innerHTML = '';
      if (lines.length === 0) {
        // 空列表，不添加条目（靠 placeholder 提示）
        return;
      }
      lines.forEach(line => {
        // 去掉开头的圆点
        const text = line.replace(/^•\s*/, '');
        listEl.appendChild(createBulletItem(text));
      });
    }

    // 创建一个圆点条目
    function createBulletItem(text) {
      const item = document.createElement('div');
      item.className = 'bullet-item';
      const dot = document.createElement('div');
      dot.className = 'bullet-dot';
      dot.textContent = '•';
      const textEl = document.createElement('div');
      textEl.className = 'bullet-text';
      textEl.contentEditable = 'true';
      textEl.textContent = text || '';
      item.appendChild(dot);
      item.appendChild(textEl);
      return item;
    }

    // 获取圆点列表的纯文本内容（每行前加•）
    function getBulletListContent(listEl) {
      const items = listEl.querySelectorAll('.bullet-item');
      const lines = [];
      items.forEach(item => {
        const textEl = item.querySelector('.bullet-text');
        const text = textEl.textContent.trim();
        if (text) lines.push('• ' + text);
      });
      return lines.join('\n');
    }

          </div>

      types.forEach(type => {

        html += `
          <div class="warehouse-all-type-section" data-type="${type}">
            <div class="warehouse-all-type-header" data-all-toggle-type="${type}">
              <span class="warehouse-all-collapse-arrow">▾</span>

        `;

        if (items.length === 0) {
          html += `<div class="warehouse-all-item-empty">暂无记录</div>`;
        } else {
          const bulletTypes = ['miao', 'thought'];
          const isBulletType = bulletTypes.includes(type);
          items.forEach(item => {
            const key = `${item.date}|${type}`;

            const dateStr = fmtWarehouseDate(item.date);

            let contentHtml = '';
            if (isEditing) {
              if (isBulletType) {
                // 圆点列表类型的编辑模式
                const lines = item.content ? item.content.split('\n').filter(l => l.trim()) : [];
                let listHtml = `<div class="warehouse-all-edit-wrap">

                    <div class="bullet-item">
                      <div class="bullet-dot">•</div>
                      <div class="bullet-text" contenteditable="true"></div>
                    </div>

                      <div class="bullet-item">
                        <div class="bullet-dot">•</div>
                        <div class="bullet-text" contenteditable="true">${escapeHtml(text)}</div>
                      </div>
                    `;
                  });

                listHtml += `</div>
                  <div class="warehouse-resize-handle warehouse-all-resize-handle" data-all-resize-date="${item.date}" data-all-resize-type="${type}"></div>

                  <div class="warehouse-resize-handle warehouse-all-resize-handle" data-all-resize-date="${item.date}" data-all-resize-type="${type}"></div>

                contentHtml = `<div class="warehouse-all-resize-wrap" data-all-resize-date="${item.date}" data-all-resize-type="${type}" data-all-resize-mode="view">
                  <div class="warehouse-all-item-content warehouse-all-item-content-resizable">${escapeHtml(item.content)}</div>
                  <div class="warehouse-resize-handle warehouse-all-resize-handle warehouse-all-view-resize-handle" data-all-resize-date="${item.date}" data-all-resize-type="${type}" data-all-resize-mode="view"></div>
                </div>`;
              }
            }

              <div class="warehouse-all-item${isEditing ? ' editing' : ''}" data-date="${item.date}" data-type="${type}">

                    <button class="warehouse-all-edit-btn" data-action="edit" data-date="${item.date}" data-type="${type}" title="编辑">✏️</button>
                  ` : `
