    // 格式化时间（HH:mm）
    function formatTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // 全部视图中切换编辑状态
    function toggleAllEdit(date, type) {
      const key = `${date}|${type}`;
      warehouseAllEditing[key] = !warehouseAllEditing[key];
      renderWarehouseAll();
      // 如果进入编辑模式，聚焦到编辑区
      if (warehouseAllEditing[key]) {
        setTimeout(() => {
          const bulletTypes = ['miao', 'thought'];
          if (bulletTypes.includes(type)) {
            const listEl = document.querySelector(`.warehouse-all-bullet-editor[data-date="${date}"][data-type="${type}"]`);
            if (listEl) {
              const lastText = listEl.querySelector('.bullet-item:last-child .bullet-text');
              if (lastText) {
                lastText.focus();
                placeCaretAtEnd(lastText);
              }
            }
          } else {
            const ta = document.querySelector(`.warehouse-all-item-textarea[data-date="${date}"][data-type="${type}"]`);
            if (ta) { ta.focus(); ta.scrollTop = ta.scrollHeight; }
          }
        }, 50);
      }
    }

    // 保存全部视图中的编辑
    function saveAllEdit(date, type) {
      const bulletTypes = ['miao', 'thought'];
      let content = '';
      if (bulletTypes.includes(type)) {
        const listEl = document.querySelector(`.warehouse-all-bullet-editor[data-date="${date}"][data-type="${type}"]`);
        if (!listEl) return;
        content = getBulletListContent(listEl);
      } else {
        const ta = document.querySelector(`.warehouse-all-item-textarea[data-date="${date}"][data-type="${type}"]`);
        if (!ta) return;
        content = ta.value;
      }
      DB.setWarehouseContent(date, type, content);
      const key = `${date}|${type}`;
      warehouseAllEditing[key] = false;
      renderWarehouseAll();
      // 同步刷新编辑区（如果是今天）
      const today = fmtDate(new Date());
      if (date === today) {
        const bulletTypes = ['miao', 'thought'];
        if (bulletTypes.includes(type)) {
          const listEl = document.querySelector(`.warehouse-bullet-list[data-type="${type}"]`);
          if (listEl) renderBulletList(listEl, ta.value);
        } else {
          const editTa = document.querySelector(`.warehouse-edit-textarea[data-type="${type}"]`);
          if (editTa) editTa.value = ta.value;
        }
      }
    }

    // escape html
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 将光标放到元素末尾
    function placeCaretAtEnd(el) {
      el.focus();
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // ============ Anchors (我的锚点) ============
    let anchorViewDate = fmtDate(new Date()); // 当前查看的日期

    function formatAnchorTime(ts) {
      const d = new Date(ts);
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    }

    function fmtAnchorDateLabel(dateStr) {
      const d = new Date(dateStr);
      const today = new Date();
      const isToday = d.toDateString() === today.toDateString();
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      const isYesterday = d.toDateString() === yesterday.toDateString();
      if (isToday) return '今天';
      if (isYesterday) return '昨天';
      return (d.getMonth() + 1) + '/' + d.getDate();
    }

    function renderAnchors() {
      const listEl = document.getElementById('anchorList');
      if (!listEl) return;
      const anchors = DB.getAnchorsByDate(anchorViewDate);
      const dateLabelEl = document.getElementById('anchorDateLabel');
      if (dateLabelEl) dateLabelEl.textContent = fmtAnchorDateLabel(anchorViewDate);

      // 后一天按钮：不能超过今天
      const nextBtn = document.getElementById('anchorNextDay');
      const today = fmtDate(new Date());
      if (nextBtn) nextBtn.disabled = anchorViewDate >= today;

      if (anchors.length === 0) {
        listEl.innerHTML = '<div class="anchor-empty">还没有锚点，添加一个吧～</div>';
        return;
      }

      listEl.innerHTML = anchors.map(a => `
        <div class="anchor-item${a.done ? ' done' : ''}" data-id="${a.id}" draggable="true">
          <div class="anchor-check${a.done ? ' done' : ''}" data-id="${a.id}">✓</div>
          <div class="anchor-text" title="双击编辑">${escapeHtml(a.text)}</div>
          <button class="anchor-del" data-id="${a.id}">×</button>
        </div>
      `).join('');

      // 勾选/取消
      listEl.querySelectorAll('.anchor-check').forEach(c => {
        c.addEventListener('click', () => {
          DB.toggleAnchor(c.dataset.id);
          renderAnchors();
        });
      });

      // 删除
      listEl.querySelectorAll('.anchor-del').forEach(b => {
        b.addEventListener('click', e => {
          e.stopPropagation();
          DB.deleteAnchor(b.dataset.id);
          renderAnchors();
        });
      });

      // 双击编辑
      listEl.querySelectorAll('.anchor-text').forEach(txt => {
        txt.addEventListener('dblclick', e => {
          e.stopPropagation();
          const id = txt.parentElement.dataset.id;
          const oldText = txt.textContent;
          const input = document.createElement('input');
          input.type = 'text';
          input.style.cssText = 'flex:1;border:1px solid var(--accent);border-radius:6px;padding:4px 8px;font-size:13px;background:rgba(255,255,255,0.6);color:var(--ink);outline:none;font-family:inherit;min-width:0;';
          input.value = oldText;
          txt.replaceWith(input);
          input.focus();
          input.select();
          const save = () => {
            const newText = input.value.trim();
            if (newText && newText !== oldText) {
              DB.updateAnchor(id, newText);
            }
            renderAnchors();
          };
          input.addEventListener('blur', save);
          input.addEventListener('keydown', ev => {
            if (ev.key === 'Enter') { ev.preventDefault(); save(); }
            if (ev.key === 'Escape') { renderAnchors(); }
          });
        });
      });

      // 拖动排序
      let dragSrcId = null;
      listEl.querySelectorAll('.anchor-item').forEach(item => {
        item.addEventListener('dragstart', e => {
          dragSrcId = item.dataset.id;
          item.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });
        item.addEventListener('dragend', () => {
          item.classList.remove('dragging');
          listEl.querySelectorAll('.anchor-item').forEach(i => i.classList.remove('drag-over'));
        });
        item.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (item.dataset.id !== dragSrcId) {
            item.classList.add('drag-over');
          }
        });
        item.addEventListener('dragleave', () => {
          item.classList.remove('drag-over');
        });
        item.addEventListener('drop', e => {
          e.preventDefault();
          item.classList.remove('drag-over');
          if (dragSrcId === item.dataset.id) return;
          const ids = Array.from(listEl.querySelectorAll('.anchor-item')).map(i => i.dataset.id);
          const srcIdx = ids.indexOf(dragSrcId);
          const targetIdx = ids.indexOf(item.dataset.id);
          ids.splice(srcIdx, 1);
          ids.splice(targetIdx, 0, dragSrcId);
          DB.reorderAnchors(anchorViewDate, ids);
          renderAnchors();
        });
      });
    }

    function prevAnchorDay() {
      const d = new Date(anchorViewDate);
      d.setDate(d.getDate() - 1);
      anchorViewDate = fmtDate(d);
      renderAnchors();
    }
    function nextAnchorDay() {
      const d = new Date(anchorViewDate);
      d.setDate(d.getDate() + 1);
      const today = fmtDate(new Date());
      if (fmtDate(d) > today) return;
      anchorViewDate = fmtDate(d);
      renderAnchors();
    }

    // ===== 音效系统 =====
    let audioCtx = null;
    let soundMuted = false;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    // 音效：耍刀出鞘（解锁面板）
    function sfxUnlock() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 0.2;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        const env = Math.sin(t * Math.PI);
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1500, now);
      filter.frequency.exponentialRampToValueAtTime(4000, now + 0.18);
      filter.Q.value = 8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(now);
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1800, now + 0.15);
      osc.frequency.exponentialRampToValueAtTime(2400, now + 0.25);
      oscGain.gain.setValueAtTime(0, now + 0.15);
      oscGain.gain.linearRampToValueAtTime(0.12, now + 0.18);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(now + 0.15); osc.stop(now + 0.55);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(3200, now + 0.17);
      gain2.gain.setValueAtTime(0.05, now + 0.17);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(now + 0.17); osc2.stop(now + 0.45);
    }

    // 音效：清脆叮（锚点展开）
    function sfxDing() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1568, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.9);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(2093, now);
      gain2.gain.setValueAtTime(0.08, now);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(now); osc2.stop(now + 0.6);
    }

    // 音效：纸页收拢（锚点折叠）
    function sfxFanClose() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 0.15;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        data[i] = (Math.random() * 2 - 1) * Math.exp(-t * 8);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1500;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(now);
    }

    // 音效：轻柔翻页（tab切换）
    function sfxPageFlip() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      // 主体：纸页摩擦声
      const bufferSize = ctx.sampleRate * 0.4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(2000, now);
      filter.frequency.exponentialRampToValueAtTime(800, now + 0.35);
      filter.Q.value = 2;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.08, now + 0.05);
      gain.gain.linearRampToValueAtTime(0.06, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(now);
      // 轻微的"啪"声（页边翻动）
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now + 0.08);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.2);
      oscGain.gain.setValueAtTime(0, now + 0.08);
      oscGain.gain.linearRampToValueAtTime(0.04, now + 0.1);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(now + 0.08); osc.stop(now + 0.3);
    }

    // 音效：磁吸关门（面板关闭按钮）
    function sfxPanelClose() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.18);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'square';
      osc2.frequency.setValueAtTime(600, now + 0.12);
      gain2.gain.setValueAtTime(0.08, now + 0.12);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(now + 0.12); osc2.stop(now + 0.2);
    }

    // 音效：军刀出鞘（仓库展开）
    function sfxWarehouseOpen() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const bufferSize = ctx.sampleRate * 0.3;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const t = i / bufferSize;
        const env = Math.sin(t * Math.PI) * 0.9 + 0.1;
        data[i] = (Math.random() * 2 - 1) * env;
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.exponentialRampToValueAtTime(3500, now + 0.28);
      filter.Q.value = 7;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.linearRampToValueAtTime(0.18, now + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(now);
      const osc = ctx.createOscillator();
      const oscGain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, now + 0.2);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.3);
      oscGain.gain.setValueAtTime(0, now + 0.2);
      oscGain.gain.linearRampToValueAtTime(0.1, now + 0.25);
      oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(oscGain).connect(ctx.destination);
      osc.start(now + 0.2); osc.stop(now + 0.65);
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(1600, now + 0.22);
      osc2.frequency.exponentialRampToValueAtTime(2000, now + 0.35);
      gain2.gain.setValueAtTime(0.08, now + 0.22);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      osc2.connect(gain2).connect(ctx.destination);
      osc2.start(now + 0.22); osc2.stop(now + 0.75);
      const osc3 = ctx.createOscillator();
      const gain3 = ctx.createGain();
      osc3.type = 'sine';
      osc3.frequency.setValueAtTime(2800, now + 0.25);
      gain3.gain.setValueAtTime(0.04, now + 0.25);
      gain3.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc3.connect(gain3).connect(ctx.destination);
      osc3.start(now + 0.25); osc3.stop(now + 0.55);
    }

    // 音效：重关门（仓库折叠）
    function sfxWarehouseClose() {
      if (soundMuted) return;
      const ctx = getAudioCtx();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.3);
      const bufferSize = ctx.sampleRate * 0.1;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const nfilter = ctx.createBiquadFilter();
      nfilter.type = 'lowpass';
      nfilter.frequency.value = 500;
      const ngain = ctx.createGain();
      ngain.gain.setValueAtTime(0.2, now);
      ngain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      noise.connect(nfilter).connect(ngain).connect(ctx.destination);
      noise.start(now);
    }

    // init warehouse events
    function initWarehouseEvents() {
      // menu button
      document.getElementById('drawerMenuBtn').addEventListener('click', toggleWarehousePanel);

      // close button — 关闭侧边栏
      document.getElementById('warehouseCloseBtn').addEventListener('click', () => {
        sfxFanClose();
        closeWarehousePanel();
      });

      // 音效开关按钮
      (function initSoundToggle() {
        const btn = document.getElementById('headerSoundBtn');
        const saved = localStorage.getItem('tt_sound_muted');
        if (saved === '1') {
          soundMuted = true;
          btn.textContent = '🔇';
          btn.title = '开启音效';
          btn.classList.add('muted');
        }
        btn.addEventListener('click', () => {
          soundMuted = !soundMuted;
          if (soundMuted) {
            btn.textContent = '🔇';
            btn.title = '开启音效';
            btn.classList.add('muted');
            localStorage.setItem('tt_sound_muted', '1');
          } else {
            btn.textContent = '🔊';
            btn.title = '关闭音效';
            btn.classList.remove('muted');
            localStorage.setItem('tt_sound_muted', '0');
          }
        });
      })();

      // 切换右侧内容显示/隐藏
      let rightCollapsed = false;
      document.getElementById('warehouseToggleRight').addEventListener('click', () => {
        rightCollapsed = !rightCollapsed;
        document.body.classList.toggle('right-collapsed', rightCollapsed);
        const btn = document.getElementById('warehouseToggleRight');
        btn.title = rightCollapsed ? '展开右侧' : '收起右侧';
        if (rightCollapsed) {
          sfxFanClose();
        } else {
          sfxUnlock();
        }
      });

      // 板块折叠按钮
      document.querySelectorAll('.panel-collapse-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const section = btn.closest('.panel-section');
          if (section) {
            const willCollapse = !section.classList.contains('collapsed');
            section.classList.toggle('collapsed');
            const isCollapsed = section.classList.contains('collapsed');
            btn.title = isCollapsed ? '展开' : '折叠';
            // 播放对应音效
            const type = btn.dataset.collapse;
            if (type === 'anchor') {
              if (isCollapsed) sfxFanClose();
              else sfxDing();
            } else if (type === 'warehouse') {
              if (isCollapsed) sfxWarehouseClose();
              else sfxDing();
            }
            // 保存折叠状态
            if (type) {
              localStorage.setItem('tt_collapse_' + type, isCollapsed ? '1' : '0');
            }
          }
        });
      });
      // 恢复折叠状态
      ['anchor', 'warehouse'].forEach(type => {
        const saved = localStorage.getItem('tt_collapse_' + type);
        if (saved === '1') {
          const btn = document.querySelector(`.panel-collapse-btn[data-collapse="${type}"]`);
          if (btn) {
            const section = btn.closest('.panel-section');
            if (section) {
              section.classList.add('collapsed');
              btn.title = '展开';
            }
          }
        }
      });

      // back button in all view — 返回编辑视图
      document.getElementById('warehouseAllBackBtn').addEventListener('click', () => {
        sfxWarehouseClose();
        switchWarehouseView('edit');
      });

      // view all button
      document.getElementById('warehouseViewAllBtn').addEventListener('click', () => {
        sfxDing();
        switchWarehouseView('all');
      });

      // three editors — auto save
      const today = fmtDate(new Date());
      ['reflection', 'miao', 'thought'].forEach(type => {
        const bulletTypes = ['miao', 'thought'];
        const isBulletType = bulletTypes.includes(type);

        if (isBulletType) {
          const listEl = document.querySelector(`.warehouse-bullet-list[data-type="${type}"]`);
          if (!listEl) return;

          function triggerBulletSave() {
            clearTimeout(warehouseSaveTimers[type]);
            warehouseSaveTimers[type] = setTimeout(() => {
              const content = getBulletListContent(listEl);
              DB.setWarehouseContent(today, type, content);
              // 如果全部视图是打开的，刷新一下
              if (warehouseCurrentView === 'all') renderWarehouseAll();
            }, 800);
          }

          // 监听输入
          listEl.addEventListener('input', (e) => {
            if (e.target.classList.contains('bullet-text')) {
              triggerBulletSave();
            }
          });

          // 点击列表空白处，添加/聚焦到最后一行
          listEl.addEventListener('click', (e) => {
            if (e.target === listEl) {
              let lastItem = listEl.querySelector('.bullet-item:last-child');
              if (!lastItem || lastItem.querySelector('.bullet-text').textContent.trim()) {
                lastItem = createBulletItem('');
                listEl.appendChild(lastItem);
              }
              const textEl = lastItem.querySelector('.bullet-text');
              textEl.focus();
              placeCaretAtEnd(textEl);
            }
          });

          // 键盘事件
          listEl.addEventListener('keydown', (e) => {
            const textEl = e.target;
            if (!textEl.classList.contains('bullet-text')) return;
            const item = textEl.closest('.bullet-item');
            if (!item) return;

            if (e.key === 'Enter' && !e.shiftKey) {
              e.preventDefault();
              // 在当前条目后面插入新条目
              const newItem = createBulletItem('');
              item.after(newItem);
              const newTextEl = newItem.querySelector('.bullet-text');
              newTextEl.focus();
              triggerBulletSave();
            } else if (e.key === 'Backspace') {
              const text = textEl.textContent;
              const sel = window.getSelection();
              const isAtStart = sel.anchorOffset === 0 && sel.focusOffset === 0;
              if (text === '' || (isAtStart && sel.isCollapsed)) {
                // 空行或光标在开头且按退格：删除当前行，聚焦上一行
                const prevItem = item.previousElementSibling;
                if (prevItem) {
                  e.preventDefault();
                  item.remove();
                  const prevText = prevItem.querySelector('.bullet-text');
                  prevText.focus();
                  placeCaretAtEnd(prevText);
                  triggerBulletSave();
                } else if (listEl.querySelectorAll('.bullet-item').length === 1) {
                  // 只有一行，删除后变空（显示 placeholder）
                  e.preventDefault();
                  item.remove();
                  triggerBulletSave();
                }
              }
            }
          });
        } else {
          const textarea = document.querySelector(`.warehouse-edit-textarea[data-type="${type}"]`);
          if (!textarea) return;

          textarea.addEventListener('input', () => {
            clearTimeout(warehouseSaveTimers[type]);
            warehouseSaveTimers[type] = setTimeout(() => {
              DB.setWarehouseContent(today, type, textarea.value);
              // 如果全部视图是打开的，刷新一下
              if (warehouseCurrentView === 'all') renderWarehouseAll();
            }, 800);
          });
        }
      });

      // 板块折叠/展开
      document.querySelectorAll('.warehouse-edit-title[data-toggle-type]').forEach(title => {
        title.addEventListener('click', (e) => {
          // 点击复制按钮时不触发折叠
          if (e.target.closest('.warehouse-edit-actions')) return;
          const type = title.dataset.toggleType;
          const block = title.closest('.warehouse-edit-block');
          const willCollapse = !block.classList.contains('collapsed');
          block.classList.toggle('collapsed');
          // 播放折叠音效
          if (willCollapse) {
            sfxFanClose();
          }
          // 保存状态到 localStorage
          const collapsed = block.classList.contains('collapsed');
          const state = JSON.parse(localStorage.getItem('warehouse_collapsed') || '{}');
          state[type] = collapsed;
          localStorage.setItem('warehouse_collapsed', JSON.stringify(state));
        });
      });
      // 恢复折叠状态
      (function restoreCollapsedState() {
        const state = JSON.parse(localStorage.getItem('warehouse_collapsed') || '{}');
        Object.keys(state).forEach(type => {
          if (state[type]) {
            const block = document.querySelector(`.warehouse-edit-block[data-type="${type}"]`);
            if (block) block.classList.add('collapsed');
          }
        });
      })();

      // 编辑区拖拽调整大小
      (function initResizeHandles() {
        const heightState = JSON.parse(localStorage.getItem('warehouse_editor_heights') || '{}');
        const minHeight = 60;

        // 恢复保存的高度
        Object.keys(heightState).forEach(type => {
          const h = heightState[type];
          if (h && h >= minHeight) {
            const textarea = document.querySelector(`.warehouse-edit-textarea[data-type="${type}"]`);
            if (textarea) textarea.style.height = h + 'px';
            const bulletList = document.querySelector(`.warehouse-bullet-list[data-type="${type}"]`);
            if (bulletList) bulletList.style.height = h + 'px';
          }
        });

        document.querySelectorAll('.warehouse-resize-handle').forEach(handle => {
          const type = handle.dataset.resizeType;
          const content = handle.parentElement;
          const textarea = content.querySelector('.warehouse-edit-textarea');
          const bulletList = content.querySelector('.warehouse-bullet-list');
          const target = textarea || bulletList;
          if (!target) return;

          let startY = 0;
          let startHeight = 0;
          let isResizing = false;

          function onMouseMove(e) {
            if (!isResizing) return;
            const delta = e.clientY - startY;
            let newHeight = startHeight + delta;
            if (newHeight < minHeight) newHeight = minHeight;
            target.style.height = newHeight + 'px';
          }

          function onMouseUp() {
            if (!isResizing) return;
            isResizing = false;
            handle.classList.remove('active');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            // 保存高度
            const h = target.offsetHeight;
            const state = JSON.parse(localStorage.getItem('warehouse_editor_heights') || '{}');
            state[type] = h;
            localStorage.setItem('warehouse_editor_heights', JSON.stringify(state));
          }

          handle.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isResizing = true;
            startY = e.clientY;
            startHeight = target.offsetHeight;
            handle.classList.add('active');
            document.body.style.cursor = 'ns-resize';
            document.body.style.userSelect = 'none';
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
          });
        });
      })();

      // copy buttons in edit view
      document.querySelectorAll('.warehouse-copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const type = btn.dataset.type;
          const bulletTypes = ['miao', 'thought'];
          if (bulletTypes.includes(type)) {
            const listEl = document.querySelector(`.warehouse-bullet-list[data-type="${type}"]`);
            if (listEl) {
              const content = getBulletListContent(listEl);
              copyToClipboard(content, btn);
            }
          } else {
            const textarea = document.querySelector(`.warehouse-edit-textarea[data-type="${type}"]`);
            if (textarea) copyToClipboard(textarea.value, btn);
          }
        });
      });

      // all view — 事件委托
      // 全部视图中分类折叠/展开
      document.getElementById('warehouseAllContent').addEventListener('click', (e) => {
        const header = e.target.closest('.warehouse-all-type-header');
        if (!header) return;
        // 点击复制按钮时不触发折叠
        if (e.target.closest('button')) return;
        const type = header.dataset.allToggleType;
        const section = header.closest('.warehouse-all-type-section');
        const willCollapse = !section.classList.contains('collapsed');
        section.classList.toggle('collapsed');
        // 播放折叠音效
        if (willCollapse) {
          sfxFanClose();
        }
        // 保存状态
        const collapsed = section.classList.contains('collapsed');
        const state = JSON.parse(localStorage.getItem('warehouse_all_collapsed') || '{}');
        state[type] = collapsed;
        localStorage.setItem('warehouse_all_collapsed', JSON.stringify(state));
      });

      document.getElementById('warehouseAllContent').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;
        const date = btn.dataset.date;
        const type = btn.dataset.type;

        if (action === 'edit') {
          toggleAllEdit(date, type);
        } else if (action === 'save') {
          saveAllEdit(date, type);
        } else if (action === 'copy') {
          const content = DB.getWarehouseContent(date, type);
          copyToClipboard(content, btn);
        }
      });

      // 全部视图中编辑区拖拽调整大小
      (function initAllResizeHandles() {
        const allContent = document.getElementById('warehouseAllContent');
        const minHeight = 60;
        let currentTarget = null;
        let startY = 0;
        let startHeight = 0;
        let currentHandle = null;

        function onMouseMove(e) {
          if (!currentTarget) return;
          const delta = e.clientY - startY;
          let newHeight = startHeight + delta;
          if (newHeight < minHeight) newHeight = minHeight;
          currentTarget.style.height = newHeight + 'px';
        }

        function onMouseUp() {
          if (!currentTarget) return;
          if (currentHandle) currentHandle.classList.remove('active');
          currentTarget = null;
          currentHandle = null;
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        }

        allContent.addEventListener('mousedown', (e) => {
          const handle = e.target.closest('.warehouse-all-resize-handle');
          if (!handle) return;
          e.preventDefault();
          const mode = handle.dataset.allResizeMode || 'edit';
          let target = null;
          if (mode === 'view') {
            const wrap = handle.closest('.warehouse-all-resize-wrap');
            if (!wrap) return;
            const contentEl = wrap.querySelector('.warehouse-all-item-content-resizable');
            const bulletList = wrap.querySelector('.warehouse-all-item-bullet-list');
            target = contentEl || bulletList;
          } else {
            const wrap = handle.closest('.warehouse-all-edit-wrap');
            if (!wrap) return;
            const textarea = wrap.querySelector('.warehouse-all-item-textarea');
            const bulletList = wrap.querySelector('.warehouse-all-bullet-editor');
            target = textarea || bulletList;
          }
          if (!target) return;

          currentTarget = target;
          currentHandle = handle;
          startY = e.clientY;
          startHeight = target.offsetHeight;
          handle.classList.add('active');
          document.body.style.cursor = 'ns-resize';
          document.body.style.userSelect = 'none';
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
      })();

      // 全部视图中圆点编辑器：点击空白处添加/聚焦到最后一行
      document.getElementById('warehouseAllContent').addEventListener('click', (e) => {
        const listEl = e.target.closest('.warehouse-all-bullet-editor');
        if (!listEl) return;
        if (e.target === listEl) {
          let lastItem = listEl.querySelector('.bullet-item:last-child');
          if (!lastItem || lastItem.querySelector('.bullet-text').textContent.trim()) {
            lastItem = createBulletItem('');
            listEl.appendChild(lastItem);
          }
          const textEl = lastItem.querySelector('.bullet-text');
          textEl.focus();
          placeCaretAtEnd(textEl);
        }
      });

      // 全部视图中圆点编辑器的键盘事件
      document.getElementById('warehouseAllContent').addEventListener('keydown', (e) => {
        const textEl = e.target;
        if (!textEl.classList.contains('bullet-text')) return;
        const listEl = textEl.closest('.warehouse-all-bullet-editor');
        if (!listEl) return;
        const item = textEl.closest('.bullet-item');
        if (!item) return;

        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          const newItem = createBulletItem('');
          item.after(newItem);
          const newTextEl = newItem.querySelector('.bullet-text');
          newTextEl.focus();
        } else if (e.key === 'Backspace') {
          const text = textEl.textContent;
          const sel = window.getSelection();
          const isAtStart = sel.anchorOffset === 0 && sel.focusOffset === 0;
          if (text === '' || (isAtStart && sel.isCollapsed)) {
            const prevItem = item.previousElementSibling;
            if (prevItem) {
              e.preventDefault();
              item.remove();
              const prevText = prevItem.querySelector('.bullet-text');
              prevText.focus();
              placeCaretAtEnd(prevText);
            } else if (listEl.querySelectorAll('.bullet-item').length === 1) {
              // 只有一行，删除后变空
              e.preventDefault();
              item.remove();
            }
          }
        }
      });

      // 复制全部按钮
      document.getElementById('warehouseAllContent').addEventListener('click', (e) => {
        const btn = e.target.closest('.warehouse-all-copy-all-btn');
        if (!btn) return;
        const type = btn.dataset.type;
        const items = DB.getWarehouseByType(type);
        if (items.length === 0) { toast('暂无内容可复制'); return; }
        const typeInfo = DB.warehouseTypes[type];
        const allText = items.map(item => {
          const dateLabel = fmtWarehouseDate(item.date);
          return `【${dateLabel}】\n${item.content}`;
        }).join('\n\n');
        const fullText = `— ${typeInfo.icon} ${typeInfo.name}（共${items.length}条） —\n\n${allText}`;
        copyToClipboard(fullText, btn);
      });

      // ===== Anchor events =====
      document.getElementById('anchorPrevDay').addEventListener('click', prevAnchorDay);
      document.getElementById('anchorNextDay').addEventListener('click', nextAnchorDay);

      // 日历选择器
      let anchorCalMonth = new Date();
      document.getElementById('anchorDateLabel').addEventListener('click', (e) => {
        e.stopPropagation();
        anchorCalMonth = new Date(anchorViewDate);
        renderAnchorCalendar();
        document.getElementById('anchorCalendarOverlay').classList.add('show');
      });

      document.getElementById('anchorCalendarOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'anchorCalendarOverlay') {
          document.getElementById('anchorCalendarOverlay').classList.remove('show');
        }
      });

      document.getElementById('anchorCalPrevMonth').addEventListener('click', () => {
        anchorCalMonth.setMonth(anchorCalMonth.getMonth() - 1);
        renderAnchorCalendar();
      });

      document.getElementById('anchorCalNextMonth').addEventListener('click', () => {
        anchorCalMonth.setMonth(anchorCalMonth.getMonth() + 1);
        renderAnchorCalendar();
      });

      document.getElementById('anchorCalTodayBtn').addEventListener('click', () => {
        anchorCalMonth = new Date();
        const today = fmtDate(new Date());
        anchorViewDate = today;
        renderAnchors();
        document.getElementById('anchorCalendarOverlay').classList.remove('show');
      });

      function renderAnchorCalendar() {
        const year = anchorCalMonth.getFullYear();
        const month = anchorCalMonth.getMonth();
        document.getElementById('anchorCalTitle').textContent = `${year}年${month + 1}月`;

        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const startWeekday = firstDay.getDay();
        const daysInMonth = lastDay.getDate();

        const todayStr = fmtDate(new Date());
        const selectedStr = anchorViewDate;

        let html = '';
        // 上月末尾
        const prevMonthLastDay = new Date(year, month, 0).getDate();
        for (let i = startWeekday - 1; i >= 0; i--) {
          const day = prevMonthLastDay - i;
          const d = new Date(year, month - 1, day);
          const ds = fmtDate(d);
          html += `<div class="anchor-cal-day other-month" data-date="${ds}">${day}</div>`;
        }
        // 本月
        for (let day = 1; day <= daysInMonth; day++) {
          const d = new Date(year, month, day);
          const ds = fmtDate(d);
          let cls = 'anchor-cal-day';
          if (ds === todayStr) cls += ' today';
          if (ds === selectedStr) cls += ' selected';
          html += `<div class="${cls}" data-date="${ds}">${day}</div>`;
        }
        // 下月开头
        const remaining = 42 - (startWeekday + daysInMonth);
        for (let day = 1; day <= remaining; day++) {
          const d = new Date(year, month + 1, day);
          const ds = fmtDate(d);
          html += `<div class="anchor-cal-day other-month" data-date="${ds}">${day}</div>`;
        }

        const daysEl = document.getElementById('anchorCalDays');
        daysEl.innerHTML = html;

        // 绑定点击事件
        daysEl.querySelectorAll('.anchor-cal-day').forEach(dayEl => {
          dayEl.addEventListener('click', () => {
            const ds = dayEl.dataset.date;
            anchorViewDate = ds;
            renderAnchors();
            document.getElementById('anchorCalendarOverlay').classList.remove('show');
          });
        });
      }

      const anchorInput = document.getElementById('anchorAddInput');
      if (anchorInput) {
        const addAnchor = () => {
          const text = anchorInput.value.trim();
          if (!text) return;
          DB.addAnchor(anchorViewDate, text);
          anchorInput.value = '';
          renderAnchors();
        };
        anchorInput.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); addAnchor(); }
        });
      }
    }

    initWarehouseEvents();

    initEvents();
    renderAll();
    Sync.pull().then(changed => {
      if (!changed) return;
      renderAll();
      if (warehousePanelOpen) {
        loadWarehouseEditors();
        if (warehouseCurrentView === 'all') renderWarehouseAll();
      }
    });

    // 定时同步：每 30 秒拉取一次云端最新数据（页面可见时）
    setInterval(() => {
      if (document.hidden || !Sync.ready) return;
      Sync.pull().then(changed => {
        if (!changed) return;
        renderAll();
        if (warehousePanelOpen) {
          loadWarehouseEditors();
          if (warehouseCurrentView === 'all') renderWarehouseAll();
        }
      }).catch(e => console.warn('Periodic sync failed:', e));
    }, 30000);
  </script>

</body></html>
